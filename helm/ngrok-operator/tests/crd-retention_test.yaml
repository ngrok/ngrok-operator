# LEGACY-kubernetesoperator-kind / LEGACY-trafficpolicy-kind: during the
# migration release the new ngrok.com CRDs are kept by Helm on rollback, and
# the uninstall hook deletes them instead. Drop this suite at cleanup.
suite: test migration-window CRD retention
templates:
- charts/ngrok-crds/templates/ngrok.com_kubernetesoperators.yaml
- charts/ngrok-crds/templates/ngrok.com_trafficpolicies.yaml
- charts/ngrok-crds/templates/ngrok.k8s.ngrok.com_kubernetesoperators.yaml
- charts/ngrok-crds/templates/ngrok.k8s.ngrok.com_ngroktrafficpolicies.yaml
- cleanup-hook/job.yaml
- cleanup-hook/rbac.yaml
tests:
- it: keeps the ngrok.com KubernetesOperator CRD on rollback
  template: charts/ngrok-crds/templates/ngrok.com_kubernetesoperators.yaml
  asserts:
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
- it: keeps the ngrok.com TrafficPolicy CRD on rollback
  template: charts/ngrok-crds/templates/ngrok.com_trafficpolicies.yaml
  asserts:
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
- it: does not keep the legacy KubernetesOperator CRD, so the cleanup release removes it
  template: charts/ngrok-crds/templates/ngrok.k8s.ngrok.com_kubernetesoperators.yaml
  asserts:
  - notExists:
      path: metadata.annotations["helm.sh/resource-policy"]
- it: does not keep the legacy NgrokTrafficPolicy CRD
  template: charts/ngrok-crds/templates/ngrok.k8s.ngrok.com_ngroktrafficpolicies.yaml
  asserts:
  - notExists:
      path: metadata.annotations["helm.sh/resource-policy"]
- it: deletes the kept CRDs on uninstall once the KubernetesOperator is gone
  template: cleanup-hook/job.yaml
  set:
    ngrok.features.cleanup.enabled: true
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: (?s)kubectl delete kubernetesoperators\.ngrok\.com "RELEASE-NAME".*kubectl get kubernetesoperators\.ngrok\.com "RELEASE-NAME" -n NAMESPACE --ignore-not-found -o name.*kubectl delete crd kubernetesoperators\.ngrok\.com trafficpolicies\.ngrok\.com
- it: leaves separately installed CRDs alone
  template: cleanup-hook/job.yaml
  set:
    ngrok.features.cleanup.enabled: true
    installCRDs: false
  asserts:
  - notMatchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: kubectl delete crd
- it: lets the hook delete only the two kept CRDs
  template: cleanup-hook/rbac.yaml
  documentIndex: 3
  set:
    ngrok.features.cleanup.enabled: true
  asserts:
  - isKind:
      of: ClusterRole
  - equal:
      path: rules
      value:
      - apiGroups:
        - apiextensions.k8s.io
        resources:
        - customresourcedefinitions
        resourceNames:
        - kubernetesoperators.ngrok.com
        - trafficpolicies.ngrok.com
        verbs:
        - delete
- it: grants no CRD access when CRDs are installed separately
  template: cleanup-hook/rbac.yaml
  set:
    ngrok.features.cleanup.enabled: true
    installCRDs: false
  asserts:
  - hasDocuments:
      count: 3
