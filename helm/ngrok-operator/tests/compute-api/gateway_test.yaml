suite: test compute API gateway
templates:
- compute-api/gateway.yaml
tests:
- it: Does not render when remote access is disabled
  asserts:
  - hasDocuments:
      count: 0
- it: Serves proxy traffic through the ngrok SDK without a Service
  set:
    compute:
      enabled: true # Deprecated poller setting; remote access takes precedence.
      remoteAccess:
        enabled: true
    credentials:
      apiKey: test-api-key
      authtoken: test-authtoken
  asserts:
  - hasDocuments:
      count: 7
  - isKind:
      of: Namespace
    documentIndex: 0
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-compute
    documentIndex: 0
  - equal:
      path: metadata.namespace
      value: RELEASE-NAME-ngrok-operator-compute
    documentIndex: 2
  - equal:
      path: metadata.namespace
      value: RELEASE-NAME-ngrok-operator-compute
    documentIndex: 3
  - equal:
      path: subjects[0].namespace
      value: NAMESPACE
    documentIndex: 3
  - contains:
      path: rules[5].verbs
      content: list
    documentIndex: 2
  - isKind:
      of: Deployment
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: compute-api-gateway
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].ports[0].name
      value: health
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].ports[0].containerPort
      value: 8081
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].env[0].name
      value: NGROK_AUTHTOKEN
    documentIndex: 4
  - equal:
      path: spec.template.spec.volumes[0].configMap.name
      value: RELEASE-NAME-ngrok-operator-compute-api
    documentIndex: 4
  - isKind:
      of: Role
    documentIndex: 5
  - equal:
      path: metadata.namespace
      value: RELEASE-NAME-ngrok-operator-compute
    documentIndex: 5
  - isKind:
      of: RoleBinding
    documentIndex: 6
  - equal:
      path: subjects[0].namespace
      value: NAMESPACE
    documentIndex: 6
- it: Propagates image pull secrets to the gateway
  set:
    compute:
      remoteAccess:
        enabled: true
    image:
      pullSecrets:
      - name: private-registry
  asserts:
  - equal:
      path: spec.template.spec.imagePullSecrets[0].name
      value: private-registry
    documentIndex: 4
- it: Uses an existing custom replica namespace without creating it
  set:
    compute:
      remoteAccess:
        enabled: true
        replicaNamespace: existing-replicas
  asserts:
  - hasDocuments:
      count: 6
  - equal:
      path: metadata.namespace
      value: existing-replicas
    documentIndex: 1
  - equal:
      path: metadata.namespace
      value: existing-replicas
    documentIndex: 2
- it: Rejects the operator namespace as the replica namespace
  release:
    namespace: management
  set:
    compute:
      remoteAccess:
        enabled: true
        replicaNamespace: management
  asserts:
  - failedTemplate:
      errorMessage: compute.remoteAccess.replicaNamespace must differ from the Helm release namespace
