suite: test compute API gateway
templates:
- compute-api/gateway.yaml
tests:
- it: Does not render when remote access is disabled
  asserts:
  - hasDocuments:
      count: 0
- it: Serves proxy traffic through the ngrok SDK without a Service
  set:
    compute:
      enabled: true # Deprecated poller setting; remote access takes precedence.
      remoteAccess:
        enabled: true
    credentials:
      apiKey: test-api-key
      authtoken: test-authtoken
  asserts:
  - hasDocuments:
      count: 7
  - isKind:
      of: Namespace
    documentIndex: 0
  - equal:
      path: metadata.name
      value: NAMESPACE-compute
    documentIndex: 0
  - equal:
      path: metadata.namespace
      value: NAMESPACE-compute
    documentIndex: 2
  - equal:
      path: metadata.namespace
      value: NAMESPACE-compute
    documentIndex: 3
  - equal:
      path: subjects[0].namespace
      value: NAMESPACE
    documentIndex: 3
  - contains:
      path: rules[5].verbs
      content: list
    documentIndex: 2
  - isKind:
      of: Deployment
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].args[0]
      value: compute-api-gateway
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].ports[0].name
      value: health
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].ports[0].containerPort
      value: 8081
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].env[0].name
      value: NGROK_AUTHTOKEN
    documentIndex: 4
  - equal:
      path: spec.template.spec.volumes[0].configMap.name
      value: RELEASE-NAME-ngrok-operator-gateway
    documentIndex: 4
  - isKind:
      of: Role
    documentIndex: 5
  - equal:
      path: metadata.namespace
      value: NAMESPACE-compute
    documentIndex: 5
  - isKind:
      of: RoleBinding
    documentIndex: 6
  - equal:
      path: subjects[0].namespace
      value: NAMESPACE
    documentIndex: 6
- it: Propagates image pull secrets to the gateway
  set:
    compute:
      remoteAccess:
        enabled: true
    image:
      pullSecrets:
      - name: private-registry
  asserts:
  - equal:
      path: spec.template.spec.imagePullSecrets[0].name
      value: private-registry
    documentIndex: 4
- it: Applies the standard pod scheduling settings to the gateway
  set:
    compute:
      remoteAccess:
        enabled: true
    computeGateway:
      replicaCount: 3
      priorityClassName: high
      terminationGracePeriodSeconds: 45
      podAnnotations:
        gatewayAnnotation: "set"
      nodeSelector:
        disktype: ssd
      tolerations:
      - key: dedicated
        operator: Exists
      topologySpreadConstraints:
      - topologyKey: topology.kubernetes.io/zone
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 256Mi
  asserts:
  - equal:
      path: spec.replicas
      value: 3
    documentIndex: 4
  - equal:
      path: spec.template.spec.priorityClassName
      value: high
    documentIndex: 4
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 45
    documentIndex: 4
  - equal:
      path: spec.template.metadata.annotations.gatewayAnnotation
      value: set
    documentIndex: 4
  - equal:
      path: spec.template.spec.nodeSelector.disktype
      value: ssd
    documentIndex: 4
  - equal:
      path: spec.template.spec.tolerations[0].key
      value: dedicated
    documentIndex: 4
  - equal:
      path: spec.template.spec.topologySpreadConstraints[0].topologyKey
      value: topology.kubernetes.io/zone
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].resources.requests.cpu
      value: 100m
    documentIndex: 4
  - equal:
      path: spec.template.spec.containers[0].resources.limits.memory
      value: 256Mi
    documentIndex: 4
- it: Falls back to the chart-wide podAnnotations and podLabels
  set:
    compute:
      remoteAccess:
        enabled: true
    podAnnotations:
      shared: "annotation"
    podLabels:
      team: infra
  asserts:
  - equal:
      path: spec.template.metadata.annotations.shared
      value: annotation
    documentIndex: 4
  - equal:
      path: spec.template.metadata.labels.team
      value: infra
    documentIndex: 4
- it: Names the gateway resources consistently
  set:
    compute:
      remoteAccess:
        enabled: true
  asserts:
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-gateway
    documentIndex: 1 # ServiceAccount
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-gateway
    documentIndex: 4 # Deployment
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-gateway-agent
    documentIndex: 5 # agent Role in the replica namespace
- it: Bases the default replica namespace on the operator namespace
  release:
    namespace: operator-system
  set:
    compute:
      remoteAccess:
        enabled: true
  asserts:
  - equal:
      path: metadata.name
      value: operator-system-compute
    documentIndex: 0
  - equal:
      path: metadata.namespace
      value: operator-system-compute
    documentIndex: 2
- it: Uses an existing custom replica namespace without creating it
  set:
    compute:
      remoteAccess:
        enabled: true
        replicaNamespace: existing-replicas
  asserts:
  - hasDocuments:
      count: 6
  - equal:
      path: metadata.namespace
      value: existing-replicas
    documentIndex: 1
  - equal:
      path: metadata.namespace
      value: existing-replicas
    documentIndex: 2
- it: Rejects the operator namespace as the replica namespace
  release:
    namespace: management
  set:
    compute:
      remoteAccess:
        enabled: true
        replicaNamespace: management
  asserts:
  - failedTemplate:
      errorMessage: compute.remoteAccess.replicaNamespace must differ from the Helm release namespace
