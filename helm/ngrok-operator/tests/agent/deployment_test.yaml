suite: test agent deployment
templates:
- agent/deployment.yaml
- agent/role.yaml
# Included because the deployment carries a checksum/secret annotation over it;
# helm unittest will not load a template unless the suite declares it.
- credentials-secret.yaml
set:
  ngrok.features:
    ingress:
      enabled: true
tests:
- it: Should match snapshot
  asserts:
  - matchSnapshot: {}
- it: Should set default components.agent.updateStrategy.type to RollingUpdate in values.yaml
  set:
    components.agent:
      updateStrategy:
        type: RollingUpdate
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.strategy.type
      value: RollingUpdate
- it: Defaults to having "soft" pod anti-affinity
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: agent
                app.kubernetes.io/instance: RELEASE-NAME
                app.kubernetes.io/name: ngrok-operator
            topologyKey: kubernetes.io/hostname
          weight: 1
- it: Adds .Values.components.common.podLabels to the agent deployment podspec
  set:
    components.common:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.labels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Does not add .Values.components.common.podLabels to the agent deployment's selector
  set:
    components.common:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: agent/deployment.yaml
  asserts:
  - isNotSubset:
      path: spec.selector.matchLabels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Supports selecting which nodes the agent should run on with node selectors
  set:
    components.agent:
      nodeSelector: &nodeSelector
        disktype: ssd
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value: *nodeSelector
- it: Supports setting tolerations on the agent pods
  set:
    components.agent:
      tolerations:
      - &toleration
        key: "key1"
        operator: "Equal"
        value: "value1"
        effect: "NoSchedule"
  template: agent/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.tolerations
      content: *toleration
- it: Supports setting topologySpreadConstraints on the agent pods
  set:
    components.agent:
      topologySpreadConstraints:
      - &tsc
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: foo
        matchLabelKeys:
          - pod-template-hash
  template: agent/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.topologySpreadConstraints
      content: *tsc
- it: Supports setting resources on the agent pods
  set:
    components.agent:
      resources: &resources
        requests:
          memory: "128Mi"
          cpu: "500m"
        limits:
          memory: "256Mi"
          cpu: "1000m"
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources
      value: *resources
- it: Leaves terminationGracePeriodSeconds to Kubernetes by default
  template: agent/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.terminationGracePeriodSeconds
- it: Applies components.common.terminationGracePeriodSeconds and updateStrategy to the agent
  set:
    components.common:
      terminationGracePeriodSeconds: 60
      updateStrategy:
        type: Recreate
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 60
  - equal:
      path: spec.strategy.type
      value: Recreate
- it: Allows overriding terminationGracePeriodSeconds for the agent
  set:
    components.agent:
      terminationGracePeriodSeconds: 45
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 45
- it: Falls back to components.common.podAnnotations when components.agent.podAnnotations is not set
  set:
    components.common:
      podAnnotations:
        global-annotation: global-value
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.annotations
      content:
        global-annotation: global-value
- it: Deep-merges components.common.podAnnotations with components.agent.podAnnotations, agent winning on collision
  set:
    components.common:
      podAnnotations:
        global-annotation: global-value
        overridden: from-pod
    components.agent:
      podAnnotations:
        agent-annotation: agent-value
        overridden: from-agent
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.annotations
      content:
        global-annotation: global-value
        agent-annotation: agent-value
        overridden: from-agent
- it: Clears components.common.podAnnotations for the agent alone with an empty map
  set:
    components.common:
      podAnnotations:
        global-annotation: global-value
    components.agent:
      podAnnotations: {}
  template: agent/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.metadata.annotations.global-annotation
- it: Clears components.common.tolerations for the agent alone with an empty list
  set:
    components.common:
      tolerations:
      - key: shared
        operator: Exists
    components.agent:
      tolerations: []
  template: agent/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.tolerations
- it: Replaces components.common.tolerations rather than appending to them
  set:
    components.common:
      tolerations:
      - key: shared
        operator: Exists
    components.agent:
      tolerations:
      - key: agent-only
        operator: Exists
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.tolerations
      value:
      - key: agent-only
        operator: Exists
- it: Clears components.common.podAntiAffinityPreset for the agent alone with an empty string
  set:
    components.agent:
      podAntiAffinityPreset: ""
  template: agent/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution
- it: Applies components.common volumes, mounts and lifecycle to the agent
  set:
    components.common:
      extraVolumes:
      - name: custom-ca
        configMap:
          name: custom-ca
      extraVolumeMounts:
      - name: custom-ca
        mountPath: /etc/ssl/custom
      lifecycle:
        preStop:
          exec:
            command: ["sleep", "5"]
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].name
      value: custom-ca
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[0].mountPath
      value: /etc/ssl/custom
  - equal:
      path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
      value: ["sleep", "5"]
- it: Supports Datadog autodiscovery annotations on agent pods
  set:
    components.agent:
      podAnnotations:
        ad.datadoghq.com/agent.logs: '[{"service":"ngrok-agent","source":"ngrok-agent"}]'
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.annotations
      content:
        ad.datadoghq.com/agent.logs: '[{"service":"ngrok-agent","source":"ngrok-agent"}]'
- it: passes operator configuration as env, not as flags
  template: agent/deployment.yaml
  asserts:
  - notMatchRegex:
      path: spec.template.spec.containers[0].args[*]
      pattern: '^--(region|root-cas|features-|log-)'
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR__FEATURES__GATEWAY__ENABLED
      any: true
- it: deep-merges pod into the component, with the component winning
  template: agent/deployment.yaml
  set:
    components.common:
      podAnnotations:
        shared: "from-pod"
        overridden: "from-pod"
      tolerations:
        - key: shared-toleration
    components.agent:
      podAnnotations:
        overridden: "from-agent"
        agentOnly: "from-agent"
      tolerations:
        - key: agent-toleration
  asserts:
    # map keys merge, component wins on collision
    - equal:
        path: spec.template.metadata.annotations.shared
        value: from-pod
    - equal:
        path: spec.template.metadata.annotations.overridden
        value: from-agent
    - equal:
        path: spec.template.metadata.annotations.agentOnly
        value: from-agent
    # arrays replace wholesale rather than appending
    - equal:
        path: spec.template.spec.tolerations
        value:
          - key: agent-toleration
- it: does not render in one-click demo mode, which has no authtoken for the agent
  template: agent/deployment.yaml
  set:
    ngrok.features:
      oneClickDemoMode:
        enabled: true
  asserts:
    - hasDocuments:
        count: 0
