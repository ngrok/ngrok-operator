suite: test agent deployment
templates:
- agent/deployment.yaml
- agent/role.yaml
# Included because the deployment carries a checksum/secret annotation over it;
# helm unittest will not load a template unless the suite declares it.
- credentials-secret.yaml
set:
  features:
    ingress:
      enabled: true
tests:
- it: Should match snapshot
  asserts:
  - matchSnapshot: {}
- it: Should set default agent.updateStrategy.type to RollingUpdate in values.yaml
  set:
    agent:
      updateStrategy:
        type: RollingUpdate
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.strategy.type
      value: RollingUpdate
- it: Defaults to having "soft" pod anti-affinity
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: agent
                app.kubernetes.io/instance: RELEASE-NAME
                app.kubernetes.io/name: ngrok-operator
            topologyKey: kubernetes.io/hostname
          weight: 1
- it: Adds .Values.defaults.podLabels to the agent deployment podspec
  set:
    defaults:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.labels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Does not add .Values.defaults.podLabels to the agent deployment's selector
  set:
    defaults:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: agent/deployment.yaml
  asserts:
  - isNotSubset:
      path: spec.selector.matchLabels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Supports selecting which nodes the agent should run on with node selectors
  set:
    agent:
      nodeSelector: &nodeSelector
        disktype: ssd
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value: *nodeSelector
- it: Supports setting tolerations on the agent pods
  set:
    agent:
      tolerations:
      - &toleration
        key: "key1"
        operator: "Equal"
        value: "value1"
        effect: "NoSchedule"
  template: agent/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.tolerations
      content: *toleration
- it: Supports setting topologySpreadConstraints on the agent pods
  set:
    agent:
      topologySpreadConstraints:
      - &tsc
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: foo
        matchLabelKeys:
          - pod-template-hash
  template: agent/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.topologySpreadConstraints
      content: *tsc
- it: Supports setting resources on the agent pods
  set:
    agent:
      resources: &resources
        requests:
          memory: "128Mi"
          cpu: "500m"
        limits:
          memory: "256Mi"
          cpu: "1000m"
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources
      value: *resources
- it: Sets terminationGracePeriodSeconds by default
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 30
- it: Allows overriding terminationGracePeriodSeconds for the agent
  set:
    agent:
      terminationGracePeriodSeconds: 45
  template: agent/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 45
- it: Falls back to defaults.podAnnotations when agent.podAnnotations is not set
  set:
    defaults:
      podAnnotations:
        global-annotation: global-value
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.annotations
      content:
        global-annotation: global-value
- it: Deep-merges defaults.podAnnotations with agent.podAnnotations, agent winning on collision
  set:
    defaults:
      podAnnotations:
        global-annotation: global-value
        overridden: from-defaults
    agent:
      podAnnotations:
        agent-annotation: agent-value
        overridden: from-agent
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.annotations
      content:
        global-annotation: global-value
        agent-annotation: agent-value
        overridden: from-agent
- it: Supports Datadog autodiscovery annotations on agent pods
  set:
    agent:
      podAnnotations:
        ad.datadoghq.com/agent.logs: '[{"service":"ngrok-agent","source":"ngrok-agent"}]'
  template: agent/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.annotations
      content:
        ad.datadoghq.com/agent.logs: '[{"service":"ngrok-agent","source":"ngrok-agent"}]'
- it: passes operator configuration as env, not as flags
  template: agent/deployment.yaml
  asserts:
  - notMatchRegex:
      path: spec.template.spec.containers[0].args[*]
      pattern: '^--(config|region|zap-)'
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR_FEATURES
      any: true
- it: deep-merges defaults into the component, with the component winning
  template: agent/deployment.yaml
  set:
    defaults:
      podAnnotations:
        shared: "from-defaults"
        overridden: "from-defaults"
      tolerations:
        - key: shared-toleration
    agent:
      podAnnotations:
        overridden: "from-agent"
        agentOnly: "from-agent"
      tolerations:
        - key: agent-toleration
  asserts:
    # map keys merge, component wins on collision
    - equal:
        path: spec.template.metadata.annotations.shared
        value: from-defaults
    - equal:
        path: spec.template.metadata.annotations.overridden
        value: from-agent
    - equal:
        path: spec.template.metadata.annotations.agentOnly
        value: from-agent
    # arrays replace wholesale rather than appending
    - equal:
        path: spec.template.spec.tolerations
        value:
          - key: agent-toleration
- it: does not render in one-click demo mode, which has no authtoken for the agent
  template: agent/deployment.yaml
  set:
    apiManager:
      config:
        oneClickDemoMode: true
  asserts:
    - hasDocuments:
        count: 0
