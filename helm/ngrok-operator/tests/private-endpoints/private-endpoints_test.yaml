suite: test private endpoints
templates:
- private-endpoints/deployment.yaml
- private-endpoints/rbac.yaml
- api-manager/deployment.yaml
# included by api-manager/deployment.yaml checksums; helm-unittest only loads listed templates
- api-manager/role.yaml
- api-manager/leader-election-role.yaml
- credentials-secret.yaml
set:
  ngrok.credentials.accessToken: tok
tests:
- it: renders nothing when disabled
  templates:
  - private-endpoints/deployment.yaml
  - private-endpoints/rbac.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: forwarder deployment uses the private endpoints token and cluster DNS
  set:
    ngrok.features.privateEndpoints.enabled: true
  template: private-endpoints/deployment.yaml
  asserts:
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-private-endpoint-forwarder
  - notExists:
      path: spec.template.spec.dnsPolicy
  - equal:
      path: spec.template.metadata.labels["app.kubernetes.io/component"]
      value: private-endpoint-forwarder
  - contains:
      path: spec.template.spec.containers[0].args
      content: private-endpoint-forwarder
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            key: PRIVATE_ENDPOINTS_ACCESS_TOKEN
            name: RELEASE-NAME-ngrok-operator-credentials
  - matchSnapshot: {}
- it: api-manager gets the feature settings as env
  set:
    ngrok.features.privateEndpoints.enabled: true
  template: api-manager/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR__FEATURES__PRIVATE_ENDPOINTS__ENABLED
        value: "true"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR__FEATURES__PRIVATE_ENDPOINTS__INCLUDE_INTERNAL
        value: "false"
- it: api-manager mirrors internal endpoints when includeInternal is set
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.features.privateEndpoints.includeInternal: true
  template: api-manager/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR__FEATURES__PRIVATE_ENDPOINTS__INCLUDE_INTERNAL
        value: "true"
- it: renders nothing in one-click demo mode
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.features.oneClickDemoMode.enabled: true
  template: private-endpoints/deployment.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: takes components.common and its own overrides
  set:
    ngrok.features.privateEndpoints.enabled: true
    components.common.nodeSelector:
      pool: shared
    components.privateEndpointForwarder.replicaCount: 2
    components.privateEndpointForwarder.log.level: debug
  template: private-endpoints/deployment.yaml
  asserts:
  - equal:
      path: spec.replicas
      value: 2
  - equal:
      path: spec.template.spec.nodeSelector
      value:
        pool: shared
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR__LOG__LEVEL
        value: debug
- it: credentials secret carries the private endpoints token, preferring the override
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.credentials.privateEndpointForwarder.accessToken: pe-tok
  template: credentials-secret.yaml
  asserts:
  - equal:
      path: data.PRIVATE_ENDPOINTS_ACCESS_TOKEN
      value: cGUtdG9r
- it: credentials secret falls back to the shared token
  set:
    ngrok.features.privateEndpoints.enabled: true
  template: credentials-secret.yaml
  asserts:
  - equal:
      path: data.PRIVATE_ENDPOINTS_ACCESS_TOKEN
      value: dG9r
- it: fails when only the agent and api-manager tokens are set
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.credentials.accessToken: ""
    ngrok.credentials.agent.accessToken: agent-only
    ngrok.credentials.apiManager.accessToken: api-only
  template: private-endpoints/deployment.yaml
  asserts:
  - failedTemplate:
      errorMessage: "ngrok.features.privateEndpoints.enabled needs an ngrok access token for the forwarder. Set ngrok.credentials.accessToken or ngrok.credentials.privateEndpointForwarder.accessToken, or set ngrok.credentials.secret.name to an existing secret with a PRIVATE_ENDPOINTS_ACCESS_TOKEN key."
- it: fails when no credentials are set at all
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.credentials.accessToken: ""
  template: private-endpoints/deployment.yaml
  asserts:
  - failedTemplate:
      errorMessage: "ngrok.features.privateEndpoints.enabled needs an ngrok access token for the forwarder. Set ngrok.credentials.accessToken or ngrok.credentials.privateEndpointForwarder.accessToken, or set ngrok.credentials.secret.name to an existing secret with a PRIVATE_ENDPOINTS_ACCESS_TOKEN key."
- it: renders with only per-component tokens when the private endpoints token is set
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.credentials.accessToken: ""
    ngrok.credentials.agent.accessToken: agent-only
    ngrok.credentials.apiManager.accessToken: api-only
    ngrok.credentials.privateEndpointForwarder.accessToken: pe-only
  template: private-endpoints/deployment.yaml
  asserts:
  - hasDocuments:
      count: 1
- it: trusts a custom secret it cannot inspect, reading PRIVATE_ENDPOINTS_ACCESS_TOKEN from it
  set:
    ngrok.features.privateEndpoints.enabled: true
    ngrok.credentials.accessToken: ""
    ngrok.credentials.secret.name: my-creds
  template: private-endpoints/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            key: PRIVATE_ENDPOINTS_ACCESS_TOKEN
            name: my-creds
# Documents in rbac.yaml: 0 forwarder SA, 1 forwarder Role, 2 its RoleBinding,
# 3 api-manager Role, 4 its RoleBinding. The kind/name asserts catch a reorder.
- it: api-manager Role grants exactly what the poller and controller use
  set:
    ngrok.features.privateEndpoints.enabled: true
  template: private-endpoints/rbac.yaml
  asserts:
  - isKind:
      of: Role
    documentIndex: 3
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-private-endpoints-manager
    documentIndex: 3
  - equal:
      path: metadata.namespace
      value: NAMESPACE
    documentIndex: 3
  - equal:
      path: rules
      value:
      - apiGroups: [ngrok.com]
        resources: [privateendpoints]
        verbs: [get, list, watch, create, update, delete]
      - apiGroups: [ngrok.com]
        resources: [privateendpoints/status]
        verbs: [get, update, patch]
      - apiGroups: [""]
        resources: [services]
        verbs: [get, list, watch, create, update, patch, delete]
    documentIndex: 3
  - isKind:
      of: RoleBinding
    documentIndex: 4
  - equal:
      path: roleRef.name
      value: RELEASE-NAME-ngrok-operator-private-endpoints-manager
    documentIndex: 4
  - equal:
      path: subjects
      value:
      - kind: ServiceAccount
        name: RELEASE-NAME-ngrok-operator
        namespace: NAMESPACE
    documentIndex: 4
- it: forwarder Role is read-only on privateendpoints
  set:
    ngrok.features.privateEndpoints.enabled: true
  template: private-endpoints/rbac.yaml
  asserts:
  - isKind:
      of: Role
    documentIndex: 1
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-private-endpoint-forwarder
    documentIndex: 1
  - equal:
      path: rules
      value:
      - apiGroups: [ngrok.com]
        resources: [privateendpoints]
        verbs: [get, list, watch]
    documentIndex: 1
  - isKind:
      of: RoleBinding
    documentIndex: 2
  - equal:
      path: subjects
      value:
      - kind: ServiceAccount
        name: RELEASE-NAME-ngrok-operator-private-endpoint-forwarder
        namespace: NAMESPACE
    documentIndex: 2
- it: needs no cluster-scoped RBAC
  set:
    ngrok.features.privateEndpoints.enabled: true
  template: private-endpoints/rbac.yaml
  asserts:
  - notEqual:
      path: kind
      value: ClusterRole
  - notEqual:
      path: kind
      value: ClusterRoleBinding
