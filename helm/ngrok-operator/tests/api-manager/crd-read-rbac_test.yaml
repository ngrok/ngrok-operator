suite: test api-manager kubernetesoperator CRD read rbac
templates:
- api-manager/crd-read-cluster-role.yaml
tests:
- it: should render a ClusterRole that can only read the KubernetesOperator CRD
  documentIndex: 0
  asserts:
  - isKind:
      of: ClusterRole
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-crd-read-cluster-role
  - equal:
      path: rules
      value:
      - apiGroups:
        - apiextensions.k8s.io
        resources:
        - customresourcedefinitions
        resourceNames:
        - kubernetesoperators.ngrok.com
        verbs:
        - get
- it: should bind the ClusterRole to the operator service account
  documentIndex: 1
  asserts:
  - isKind:
      of: ClusterRoleBinding
  - equal:
      path: roleRef.name
      value: RELEASE-NAME-ngrok-operator-crd-read-cluster-role
- it: should stay cluster-scoped in namespaced mode
  set:
    ngrok.features.ingress.watchNamespace: test-ns
  asserts:
  - hasDocuments:
      count: 2
  - isKind:
      of: ClusterRole
    documentIndex: 0
