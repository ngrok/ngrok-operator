suite: test controller-deployment
templates:
- api-manager/deployment.yaml
# The following included templates are needed due to the way helm unittest works.
# It won't load the templates unless they are included here. Due to the checksums
# we are including on the deployment, we need to include them here. It makes the
# snapshot much larger than it needs to be, but it's the only way to test the
# deployment at this time.
- api-manager/role.yaml
- api-manager/leader-election-role.yaml
- credentials-secret.yaml
- configmap.yaml
tests:
- it: Should match default snapshot
  asserts:
  - matchSnapshot: {}
- it: Should match all-options snapshot
  set:
    defaults:
      extraEnv:
        TEST_ENV_VAR: test
        SECRET_ENV_VAR:
          secretKeyRef:
            key: test-key
          value: test-value
      extraVolumes:
      - name: test-volume
        emptyDir: {}
      extraVolumeMounts:
      - name: test-volume
        mountPath: /test-volume
  asserts:
  - matchSnapshot: {}
- it: Should use the specified secret name for the credentials secret
  set:
    credentials.secret.name: test-secret-name
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      pattern: test-secret-name
- it: Should pass through extra volumes and extra volume mounts
  set:
    defaults:
      extraVolumes:
      - name: test-volume
        emptyDir: {}
      extraVolumeMounts:
      - name: test-volume
        mountPath: /test-volume
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: test-volume
        emptyDir: {}
  - matchRegex:
      path: spec.template.spec.containers[0].volumeMounts[1].name
      pattern: test-volume
  - matchRegex:
      path: spec.template.spec.containers[0].volumeMounts[1].mountPath
      pattern: /test-volume
- it: Defaults to having "soft" pod anti-affinity
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/instance: RELEASE-NAME
                app.kubernetes.io/name: ngrok-operator
            topologyKey: kubernetes.io/hostname
          weight: 1
- it: Easily allows for setting a "hard" pod anti-affinity
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    defaults:
      podAntiAffinityPreset: "hard"
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: ngrok-operator
          topologyKey: kubernetes.io/hostname
- it: Allows overriding the full affinity
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    defaults:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - antarctica-east1
                - antarctica-west1
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: another-node-label-key
                operator: In
                values:
                - another-node-label-value
  asserts:
  - equal:
      path: spec.template.spec.affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - antarctica-east1
                - antarctica-west1
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: another-node-label-key
                operator: In
                values:
                - another-node-label-value
- it: Defaults to not specifying a priority class
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - notExists:
      path: spec.template.spec.priorityClassName
- it: Allows setting a priority class
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    apiManager:
      priorityClassName: "high-priority"
  asserts:
  - equal:
      path: spec.template.spec.priorityClassName
      value: high-priority
- it: Sets terminationGracePeriodSeconds by default
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 30
- it: Allows overriding terminationGracePeriodSeconds
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    apiManager:
      terminationGracePeriodSeconds: 120
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 120
- it: Adds .Values.defaults.podLabels to the controller deployment podspec
  set:
    defaults:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - isSubset:
      path: spec.template.metadata.labels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Does not add .Values.defaults.podLabels to the controller deployment's selector
  set:
    defaults:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - isNotSubset:
      path: spec.selector.matchLabels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Supports selecting which nodes the manager should run on with node selectors
  set:
    apiManager:
      nodeSelector: &nodeSelector
        disktype: ssd
  template: api-manager/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value: *nodeSelector
- it: Supports setting tolerations on the manager pods
  set:
    apiManager:
      tolerations:
      - &toleration
        key: "key1"
        operator: "Equal"
        value: "value1"
        effect: "NoSchedule"
  template: api-manager/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.tolerations
      content: *toleration
- it: Supports setting topologySpreadConstraints on the manager pods
  set:
    apiManager:
      topologySpreadConstraints:
      - &tsc
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: foo
        matchLabelKeys:
          - pod-template-hash
  template: api-manager/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.topologySpreadConstraints
      content: *tsc
- it: passes only identity args and the config file
  template: api-manager/deployment.yaml
  documentIndex: 0
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --config=/etc/ngrok-operator/apiManager.yaml
  - notMatchRegex:
      path: spec.template.spec.containers[0].args[*]
      pattern: '^--region='
- it: mounts the operator config
  template: api-manager/deployment.yaml
  documentIndex: 0
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: operator-config
        configMap:
          name: RELEASE-NAME-ngrok-operator-config
- it: deep-merges defaults into the component, with the component winning
  template: api-manager/deployment.yaml
  documentIndex: 0
  set:
    defaults:
      podAnnotations:
        shared: "from-defaults"
        overridden: "from-defaults"
      tolerations:
        - key: shared-toleration
    apiManager:
      podAnnotations:
        overridden: "from-apiManager"
        apiManagerOnly: "from-apiManager"
      tolerations:
        - key: apiManager-toleration
  asserts:
    # map keys merge, component wins on collision
    - equal:
        path: spec.template.metadata.annotations.shared
        value: from-defaults
    - equal:
        path: spec.template.metadata.annotations.overridden
        value: from-apiManager
    - equal:
        path: spec.template.metadata.annotations.apiManagerOnly
        value: from-apiManager
    # arrays replace wholesale rather than appending
    - equal:
        path: spec.template.spec.tolerations
        value:
          - key: apiManager-toleration
- it: rolls only this component when its own config changes
  template: api-manager/deployment.yaml
  documentIndex: 0
  set:
    apiManager:
      log:
        level: debug
  asserts:
    - exists:
        path: spec.template.metadata.annotations["checksum/config"]
- it: renders apiManager.updateStrategy as the Deployment strategy
  template: api-manager/deployment.yaml
  set:
    apiManager:
      updateStrategy:
        type: Recreate
  asserts:
    - equal:
        path: spec.strategy.type
        value: Recreate
