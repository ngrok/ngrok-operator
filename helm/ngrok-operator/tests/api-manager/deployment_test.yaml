suite: test controller-deployment
templates:
- api-manager/deployment.yaml
# The following included templates are needed due to the way helm unittest works.
# It won't load the templates unless they are included here. Due to the checksums
# we are including on the deployment, we need to include them here. It makes the
# snapshot much larger than it needs to be, but it's the only way to test the
# deployment at this time.
- api-manager/role.yaml
- api-manager/leader-election-role.yaml
- credentials-secret.yaml
tests:
- it: Should match default snapshot
  asserts:
  - matchSnapshot: {}
- it: Should match all-options snapshot
  set:
    components.common:
      extraEnv:
        TEST_ENV_VAR: test
        SECRET_ENV_VAR:
          secretKeyRef:
            key: test-key
          value: test-value
    components.apiManager:
      extraVolumes:
      - name: test-volume
        emptyDir: {}
      extraVolumeMounts:
      - name: test-volume
        mountPath: /test-volume
  asserts:
  - matchSnapshot: {}
- it: Should use the specified secret name for the credentials secret
  set:
    ngrok.credentials.secret.name: test-secret-name
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      pattern: test-secret-name
- it: Should pass through extra volumes and extra volume mounts
  set:
    components.apiManager:
      extraVolumes:
      - name: test-volume
        emptyDir: {}
      extraVolumeMounts:
      - name: test-volume
        mountPath: /test-volume
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: test-volume
        emptyDir: {}
  - matchRegex:
      path: spec.template.spec.containers[0].volumeMounts[0].name
      pattern: test-volume
  - matchRegex:
      path: spec.template.spec.containers[0].volumeMounts[0].mountPath
      pattern: /test-volume
- it: Defaults to having "soft" pod anti-affinity
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/instance: RELEASE-NAME
                app.kubernetes.io/name: ngrok-operator
            topologyKey: kubernetes.io/hostname
          weight: 1
- it: Easily allows for setting a "hard" pod anti-affinity
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    components.common:
      podAntiAffinityPreset: "hard"
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: ngrok-operator
          topologyKey: kubernetes.io/hostname
- it: Allows overriding the full affinity
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    components.common:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - antarctica-east1
                - antarctica-west1
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: another-node-label-key
                operator: In
                values:
                - another-node-label-value
  asserts:
  - equal:
      path: spec.template.spec.affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - antarctica-east1
                - antarctica-west1
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: another-node-label-key
                operator: In
                values:
                - another-node-label-value
- it: Defaults to not specifying a priority class
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - notExists:
      path: spec.template.spec.priorityClassName
- it: Allows setting a priority class
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    components.apiManager:
      priorityClassName: "high-priority"
  asserts:
  - equal:
      path: spec.template.spec.priorityClassName
      value: high-priority
- it: Leaves terminationGracePeriodSeconds to Kubernetes by default
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - notExists:
      path: spec.template.spec.terminationGracePeriodSeconds
- it: Allows overriding terminationGracePeriodSeconds
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  set:
    components.apiManager:
      terminationGracePeriodSeconds: 120
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 120
- it: Adds .Values.components.common.podLabels to the controller deployment podspec
  set:
    components.common:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - isSubset:
      path: spec.template.metadata.labels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Does not add .Values.components.common.podLabels to the controller deployment's selector
  set:
    components.common:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: api-manager/deployment.yaml
  documentIndex: 0 # Document 0 is the deployment since its the first template
  asserts:
  - isNotSubset:
      path: spec.selector.matchLabels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Supports selecting which nodes the manager should run on with node selectors
  set:
    components.apiManager:
      nodeSelector: &nodeSelector
        disktype: ssd
  template: api-manager/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value: *nodeSelector
- it: Supports setting tolerations on the manager pods
  set:
    components.apiManager:
      tolerations:
      - &toleration
        key: "key1"
        operator: "Equal"
        value: "value1"
        effect: "NoSchedule"
  template: api-manager/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.tolerations
      content: *toleration
- it: Supports setting topologySpreadConstraints on the manager pods
  set:
    components.apiManager:
      topologySpreadConstraints:
      - &tsc
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: foo
        matchLabelKeys:
          - pod-template-hash
  template: api-manager/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.topologySpreadConstraints
      content: *tsc
- it: passes operator configuration as env, not as flags
  template: api-manager/deployment.yaml
  documentIndex: 0
  asserts:
  - notMatchRegex:
      path: spec.template.spec.containers[0].args[*]
      pattern: '^--(region|root-cas|features-|log-)'
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR__FEATURES__GATEWAY__ENABLED
      any: true
- it: deep-merges pod into the component, with the component winning
  template: api-manager/deployment.yaml
  documentIndex: 0
  set:
    components.common:
      podAnnotations:
        shared: "from-pod"
        overridden: "from-pod"
      tolerations:
        - key: shared-toleration
    components.apiManager:
      podAnnotations:
        overridden: "from-apiManager"
        apiManagerOnly: "from-apiManager"
      tolerations:
        - key: apiManager-toleration
  asserts:
    # map keys merge, component wins on collision
    - equal:
        path: spec.template.metadata.annotations.shared
        value: from-pod
    - equal:
        path: spec.template.metadata.annotations.overridden
        value: from-apiManager
    - equal:
        path: spec.template.metadata.annotations.apiManagerOnly
        value: from-apiManager
    # arrays replace wholesale rather than appending
    - equal:
        path: spec.template.spec.tolerations
        value:
          - key: apiManager-toleration
- it: Should not mount the access token in one-click-demo mode
  set:
    ngrok.features:
      oneClickDemoMode:
        enabled: true
  template: api-manager/deployment.yaml
  documentIndex: 0
  asserts:
  # One-click-demo mode never reaches the ngrok API, and no credentials Secret is
  # rendered without a token, so a secretKeyRef here would keep the pod from starting.
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_ACCESS_TOKEN
      any: true
- it: Should mount the access token when not in one-click-demo mode
  set:
    ngrok.credentials:
      accessToken: "test-token"
  template: api-manager/deployment.yaml
  documentIndex: 0
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            key: API_MANAGER_ACCESS_TOKEN
            name: RELEASE-NAME-ngrok-operator-credentials
- it: renders components.apiManager.updateStrategy as the Deployment strategy
  template: api-manager/deployment.yaml
  set:
    components.apiManager:
      updateStrategy:
        type: Recreate
  asserts:
    - equal:
        path: spec.strategy.type
        value: Recreate
- it: turns on leader election, which the operator leaves off unless --election-id is set
  template: api-manager/deployment.yaml
  documentIndex: 0
  asserts:
    - contains:
        path: spec.template.spec.containers[0].args
        content: --election-id=RELEASE-NAME-ngrok-operator-leader
