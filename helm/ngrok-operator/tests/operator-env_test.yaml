suite: operator configuration env
templates:
  - api-manager/deployment.yaml
  - agent/deployment.yaml
  # Included for the Deployments' checksum annotations; helm unittest loads
  # only the templates a suite declares.
  - api-manager/role.yaml
  - api-manager/leader-election-role.yaml
  - agent/role.yaml
  - credentials-secret.yaml
set:
  credentials.accessToken: x
tests:
  - it: renders one variable per setting, leaving out empty values
    template: agent/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__GATEWAY__ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__INGRESS__CONTROLLER_NAME
            value: k8s.ngrok.com/ingress-controller
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_REGION
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_LOG__LEVEL
          any: true

  - it: gives every component the shared settings
    set:
      ngrok.region: eu
      ngrok.metadata:
        example.com/team: k8s
    asserts:
      - template: api-manager/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_REGION
            value: eu
      - template: agent/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_METADATA
            value: '{"example.com/team":"k8s"}'

  - it: renders clusterDomain and features.cleanup.drainPolicy, but not the chart-only cleanup values
    template: api-manager/deployment.yaml
    set:
      clusterDomain: cluster.example
      features.cleanup.drainPolicy: Delete
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_CLUSTER_DOMAIN
            value: cluster.example
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__CLEANUP__DRAIN_POLICY
            value: Delete
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__CLEANUP__ENABLED
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__CLEANUP__TIMEOUT
          any: true

  - it: lets a component override the shared log settings for itself alone
    set:
      log.level: info
      log.format: json
      agent.log.level: debug
    asserts:
      - template: agent/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_LOG__LEVEL
            value: debug
      - template: agent/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_LOG__FORMAT
            value: json
      - template: api-manager/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_LOG__LEVEL
            value: info

  - it: treats an empty component value as inherit, not as an override to empty
    template: agent/deployment.yaml
    set:
      log.level: info
      agent.log.level: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_LOG__LEVEL
            value: info

  - it: keeps quotes and commas in list values intact
    template: api-manager/deployment.yaml
    set:
      features.bindings.endpointSelectors: ["a == 'x,y'"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__BINDINGS__ENDPOINT_SELECTORS
            value: '["a == ''x,y''"]'

  - it: renders one-click demo mode like any other feature
    set:
      features.oneClickDemoMode.enabled: true
    asserts:
      - template: api-manager/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGROK_OPERATOR_FEATURES__ONE_CLICK_DEMO_MODE__ENABLED
            value: "true"

  - it: lets extraEnv override a setting, since it is listed after it
    template: agent/deployment.yaml
    set:
      agent.extraEnv:
        NGROK_OPERATOR_LOG__LEVEL: debug
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[-1]
          value:
            name: NGROK_OPERATOR_LOG__LEVEL
            value: debug

  - it: rejects a per-component features override
    template: agent/deployment.yaml
    set:
      agent.features.gateway.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "agent.features is not supported"

  - it: rejects a per-component ngrok override
    template: api-manager/deployment.yaml
    set:
      apiManager.ngrok.region: eu
    asserts:
      - failedTemplate:
          errorPattern: "apiManager.ngrok is not supported"

  # LEGACY-values-layout: BEGIN
  - it: fails on values from the pre-0.25 layout
    template: api-manager/deployment.yaml
    set:
      region: eu
      ingress.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "(?s)ingress -> features.ingress.*region -> ngrok.region"

  - it: fails on the cleanup hook settings that moved to features.cleanup
    template: api-manager/deployment.yaml
    set:
      cleanupHook.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "cleanupHook.enabled -> features.cleanup.enabled"
  # LEGACY-values-layout: END
