suite: operator config ConfigMap
templates:
  - configmap.yaml
tests:
  - it: renders one key per component
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ngrok-operator-config
      - exists:
          path: data["apiManager.yaml"]
      - exists:
          path: data["agent.yaml"]
      - exists:
          path: data["bindingsForwarder.yaml"]

  - it: omits empty values, so the operator's built-in default applies
    asserts:
      - equal:
          path: data["agent.yaml"]
          value: |
            features:
              bindings:
                enabled: false
              gateway:
                disableReferenceGrants: false
                enabled: true
              ingress:
                controllerName: k8s.ngrok.com/ingress-controller
                enabled: true

  - it: gives every component the shared config
    set:
      ngrok.region: eu
      log.level: info
    asserts:
      - matchRegex:
          path: data["apiManager.yaml"]
          pattern: "region: eu"
      - matchRegex:
          path: data["agent.yaml"]
          pattern: "region: eu"
      - matchRegex:
          path: data["bindingsForwarder.yaml"]
          pattern: "level: info"

  - it: lets a component override the shared log settings for itself alone
    set:
      log.level: info
      log.format: json
      agent.config.log.level: debug
    asserts:
      - matchRegex:
          path: data["agent.yaml"]
          pattern: "(?s)log:\\s+format: json\\s+level: debug"
      - matchRegex:
          path: data["apiManager.yaml"]
          pattern: "(?s)log:\\s+format: json\\s+level: info"

  - it: treats an empty component value as inherit, not as an override to empty
    set:
      log.level: info
      agent.config.log.level: ""
    asserts:
      - matchRegex:
          path: data["agent.yaml"]
          pattern: "level: info"

  - it: gives every component the same ngrok and features settings
    set:
      ngrok.metadata.team: k8s
      features.bindings.endpointSelectors: ["a", "b"]
    asserts:
      - matchRegex:
          path: data["agent.yaml"]
          pattern: "(?s)endpointSelectors:\\s+- a\\s+- b.*metadata:\\s+team: k8s"
      - matchRegex:
          path: data["apiManager.yaml"]
          pattern: "(?s)endpointSelectors:\\s+- a\\s+- b.*metadata:\\s+team: k8s"

  - it: rejects a per-component features override
    set:
      agent.config.features.gateway.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "agent.config.features is not supported"

  - it: rejects a per-component ngrok override
    set:
      apiManager.config.ngrok.region: eu
    asserts:
      - failedTemplate:
          errorPattern: "apiManager.config.ngrok is not supported"

  - it: writes component-only settings under that component's section
    set:
      apiManager.config.oneClickDemoMode: true
    asserts:
      - matchRegex:
          path: data["apiManager.yaml"]
          pattern: "(?m)^apiManager:\\n  oneClickDemoMode: true$"
      - notMatchRegex:
          path: data["agent.yaml"]
          pattern: "oneClickDemoMode"

  - it: keeps pod and chart-only settings out of the config files
    set:
      apiManager.replicaCount: 3
      defaults.podAnnotations.team: k8s
    asserts:
      - notMatchRegex:
          path: data["apiManager.yaml"]
          pattern: "replicaCount|podAnnotations|ingressClass"

  - it: fails on values from the pre-0.25 layout
    set:
      region: eu
      ingress.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "(?s)ingress -> features.ingress.*region -> ngrok.region"
