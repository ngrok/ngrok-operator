suite: test ngrok.com/v1 KubernetesOperator access
templates:
- api-manager/release-namespace-role.yaml
- agent/release-namespace-role.yaml
- bindings-forwarder/role.yaml
- cleanup-hook/rbac.yaml
- cleanup-hook/job.yaml
- rbac/crd-access/kubernetesoperator-editor.yaml
- rbac/crd-access/kubernetesoperator-viewer.yaml
tests:
- it: lets api-manager manage the ngrok.com KubernetesOperator
  template: api-manager/release-namespace-role.yaml
  documentIndex: 0
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators]
        verbs: [create, get, list, patch, update, watch]
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators/finalizers]
        verbs: [patch, update]
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators/status]
        verbs: [get, patch, update]
- it: keeps api-manager able to neutralize the legacy KubernetesOperator
  template: api-manager/release-namespace-role.yaml
  documentIndex: 0
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.k8s.ngrok.com]
        resources: [kubernetesoperators]
        verbs: [create, get, list, patch, update, watch]
- it: lets the agent read both KubernetesOperator kinds
  template: agent/release-namespace-role.yaml
  documentIndex: 0
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch]
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.k8s.ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch]
- it: lets the bindings forwarder read both KubernetesOperator kinds
  template: bindings-forwarder/role.yaml
  documentIndex: 0
  set:
    ngrok.features.bindings.enabled: true
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch]
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.k8s.ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch]
- it: lets the cleanup hook delete both KubernetesOperator kinds
  template: cleanup-hook/rbac.yaml
  documentIndex: 1
  set:
    ngrok.features.cleanup.enabled: true
  asserts:
  - isKind:
      of: Role
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch, delete]
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.k8s.ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch, delete]
- it: deletes the ngrok.com KubernetesOperator by its fully qualified name
  template: cleanup-hook/job.yaml
  set:
    ngrok.features.cleanup.enabled: true
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: kubectl delete kubernetesoperators\.ngrok\.com "RELEASE-NAME" -n NAMESPACE --wait=true
  - matchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: kubectl delete kubernetesoperators\.ngrok\.k8s\.ngrok\.com "RELEASE-NAME" -n NAMESPACE --ignore-not-found --wait=false
  - notMatchRegex:
      path: spec.template.spec.containers[0].command[2]
      pattern: kubectl delete kubernetesoperator "
- it: grants editors access to the ngrok.com KubernetesOperator
  template: rbac/crd-access/kubernetesoperator-editor.yaml
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators]
        verbs: [create, delete, get, list, patch, update, watch]
- it: grants viewers access to the ngrok.com KubernetesOperator
  template: rbac/crd-access/kubernetesoperator-viewer.yaml
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ngrok.com]
        resources: [kubernetesoperators]
        verbs: [get, list, watch]
