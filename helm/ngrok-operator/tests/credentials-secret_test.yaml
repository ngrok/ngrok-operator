suite: test credentials-secret
templates:
- credentials-secret.yaml
tests:
- it: Should match snapshot
  set:
    credentials.pat: "test-pat"
  asserts:
  - matchSnapshot: {}
- it: Should not generate if the pat isn't set
  asserts:
  - hasDocuments:
      count: 0
- it: Should fail loudly if the removed apiKey value is still set
  set:
    credentials.apiKey: "test-api-key"
  asserts:
  - failedTemplate:
      errorMessage: credentials.apiKey and credentials.authtoken have been replaced by a single credentials.pat (an ngrok personal access token). See https://dashboard.ngrok.com/settings/access-tokens
- it: Should fail loudly if the removed authtoken value is still set
  set:
    credentials.authtoken: "legacy"
  asserts:
  - failedTemplate:
      errorMessage: credentials.apiKey and credentials.authtoken have been replaced by a single credentials.pat (an ngrok personal access token). See https://dashboard.ngrok.com/settings/access-tokens
- it: Should generate a secret with the correct name
  release:
    name: test-release
    namespace: test-namespace
  set:
    credentials.pat: "test-pat"
  asserts:
    - hasDocuments:
        count: 1
    - matchRegex:
        path: metadata.name
        pattern: test-release-*
    - matchRegex:
        path: metadata.namespace
        pattern: test-namespace
