suite: test credentials-secret
templates:
- credentials-secret.yaml
tests:
- it: Should match snapshot
  set:
    credentials.accessToken: "test-token"
  asserts:
  - matchSnapshot: {}
- it: Should not generate if the access token isn't set
  asserts:
  - hasDocuments:
      count: 0
- it: Should fail loudly if the removed apiKey value is still set
  set:
    credentials.apiKey: "test-api-key"
  asserts:
  - failedTemplate:
      errorMessage: credentials.apiKey and credentials.authtoken have been replaced by a single credentials.accessToken (an ngrok access token). See https://dashboard.ngrok.com/settings/access-tokens
- it: Should fail loudly if the removed authtoken value is still set
  set:
    credentials.authtoken: "legacy"
  asserts:
  - failedTemplate:
      errorMessage: credentials.apiKey and credentials.authtoken have been replaced by a single credentials.accessToken (an ngrok access token). See https://dashboard.ngrok.com/settings/access-tokens
- it: Should give both components the shared token when no override is set
  set:
    credentials.accessToken: "shared-token"
  asserts:
  - equal:
      path: data.AGENT_ACCESS_TOKEN
      value: "c2hhcmVkLXRva2Vu"
  - equal:
      path: data.API_MANAGER_ACCESS_TOKEN
      value: "c2hhcmVkLXRva2Vu"
- it: Should let one component override the shared token
  set:
    credentials.accessToken: "shared-token"
    credentials.agent.accessToken: "agent-only"
  asserts:
  - equal:
      path: data.AGENT_ACCESS_TOKEN
      value: "YWdlbnQtb25seQ=="
  - equal:
      path: data.API_MANAGER_ACCESS_TOKEN
      value: "c2hhcmVkLXRva2Vu"
- it: Should accept per-component tokens with no shared token
  set:
    credentials.agent.accessToken: "agent-only"
    credentials.apiManager.accessToken: "api-only"
  asserts:
  - equal:
      path: data.AGENT_ACCESS_TOKEN
      value: "YWdlbnQtb25seQ=="
  - equal:
      path: data.API_MANAGER_ACCESS_TOKEN
      value: "YXBpLW9ubHk="
- it: Should fail if only one component has a token
  set:
    credentials.agent.accessToken: "agent-only"
  asserts:
  - failedTemplate:
      errorMessage: Only one component has an ngrok access token. Set credentials.accessToken for both, or set both credentials.agent.accessToken and credentials.apiManager.accessToken.
- it: Should generate a secret with the correct name
  release:
    name: test-release
    namespace: test-namespace
  set:
    credentials.accessToken: "test-token"
  asserts:
    - hasDocuments:
        count: 1
    - matchRegex:
        path: metadata.name
        pattern: test-release-*
    - matchRegex:
        path: metadata.namespace
        pattern: test-namespace
