suite: test ingress-class
templates:
- ingress-class.yaml
tests:
- it: Should match snapshot
  set:
    ngrok.features.ingress.enabled: true
    ngrok.features.ingress.ingressClass.create: true
  asserts:
  - matchSnapshot: {}
- it: Creates an default ingress class called ngrok by default
  set:
    ngrok.features.ingress.enabled: true
    ngrok.features.ingress.ingressClass.create: true
  asserts:
  - isKind:
      of: IngressClass
  - hasDocuments:
      count: 1
- it: Does not create an ingress class when ngrok.features.ingress.enabled is false
  set:
    ngrok.features.ingress.enabled: false
  asserts:
  - hasDocuments:
      count: 0
- it: Does not create an ingress class when ngrok.features.ingress.ingressClass.create is false
  set:
    ngrok.features.ingress.enabled: true
    ngrok.features.ingress.ingressClass.create: false
  asserts:
  - hasDocuments:
      count: 0
