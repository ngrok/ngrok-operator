suite: test bindings forwarder deployment
templates:
- bindings-forwarder/deployment.yaml
- bindings-forwarder/role.yaml
set:
  ngrok.features:
    bindings:
      enabled: true
tests:
- it: Should match snapshot
  template: bindings-forwarder/deployment.yaml
  asserts:
  - matchSnapshot: {}
- it: Should set default components.bindingsForwarder.updateStrategy.type to RollingUpdate in values.yaml
  set:
    components.bindingsForwarder:
      updateStrategy:
        type: RollingUpdate
  template: bindings-forwarder/deployment.yaml
  asserts:
  - equal:
      path: spec.strategy.type
      value: RollingUpdate
- it: should create a deployment if ngrok.features.bindings.enabled is true
  template: bindings-forwarder/deployment.yaml
  asserts:
  - isKind:
      of: Deployment
  - isAPIVersion:
      of: apps/v1
  - equal:
      path: metadata.name
      value: RELEASE-NAME-ngrok-operator-bindings-forwarder
- it: Defaults to having "soft" pod anti-affinity
  template: bindings-forwarder/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.affinity.podAntiAffinity
      value:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: bindings-forwarder
                app.kubernetes.io/instance: RELEASE-NAME
                app.kubernetes.io/name: ngrok-operator
            topologyKey: kubernetes.io/hostname
          weight: 1
- it: Adds .Values.components.common.podLabels to the forwarder deployment podspec
  set:
    components.common:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: bindings-forwarder/deployment.yaml
  asserts:
  - isSubset:
      path: spec.template.metadata.labels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Does not add .Values.components.common.podLabels to the forwarder deployment's selector
  set:
    components.common:
      podLabels:
        labelKey1: labelValue1
        labelKey2: labelValue2
  template: bindings-forwarder/deployment.yaml
  asserts:
  - isNotSubset:
      path: spec.selector.matchLabels
      content:
        labelKey1: labelValue1
        labelKey2: labelValue2
- it: Supports selecting which nodes the bindings forwarders should run on with node selectors
  set:
    components.bindingsForwarder:
      nodeSelector: &nodeSelector
        disktype: ssd
  template: bindings-forwarder/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value: *nodeSelector
- it: Supports setting tolerations on the bindings forwarder pods
  set:
    components.bindingsForwarder:
      tolerations:
      - &toleration
        key: "key1"
        operator: "Equal"
        value: "value1"
        effect: "NoSchedule"
  template: bindings-forwarder/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.tolerations
      content: *toleration
- it: Supports setting topologySpreadConstraints on the bindings forwarder pods
  set:
    components.bindingsForwarder:
      topologySpreadConstraints:
      - &tsc
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: foo
        matchLabelKeys:
          - pod-template-hash
  template: bindings-forwarder/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.topologySpreadConstraints
      content: *tsc
- it: Supports setting resources on the bindings forwarder pods
  set:
    components.bindingsForwarder:
      resources: &resources
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
  template: bindings-forwarder/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources
      value: *resources
- it: Leaves terminationGracePeriodSeconds to Kubernetes by default
  template: bindings-forwarder/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.terminationGracePeriodSeconds
- it: Allows overriding terminationGracePeriodSeconds for the bindings forwarder
  set:
    components.bindingsForwarder:
      terminationGracePeriodSeconds: 75
  template: bindings-forwarder/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 75
- it: passes operator configuration as env, not as flags
  template: bindings-forwarder/deployment.yaml
  asserts:
  - notMatchRegex:
      path: spec.template.spec.containers[0].args[*]
      pattern: '^--(region|root-cas|features-|log-)'
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: NGROK_OPERATOR_FEATURES__GATEWAY__ENABLED
      any: true
- it: deep-merges pod into the component, with the component winning
  template: bindings-forwarder/deployment.yaml
  set:
    components.common:
      podAnnotations:
        shared: "from-pod"
        overridden: "from-pod"
      tolerations:
        - key: shared-toleration
    components.bindingsForwarder:
      podAnnotations:
        overridden: "from-forwarder"
        forwarderOnly: "from-forwarder"
      tolerations:
        - key: forwarder-toleration
  asserts:
    # map keys merge, component wins on collision
    - equal:
        path: spec.template.metadata.annotations.shared
        value: from-pod
    - equal:
        path: spec.template.metadata.annotations.overridden
        value: from-forwarder
    - equal:
        path: spec.template.metadata.annotations.forwarderOnly
        value: from-forwarder
    # arrays replace wholesale rather than appending
    - equal:
        path: spec.template.spec.tolerations
        value:
          - key: forwarder-toleration
- it: does not render in one-click demo mode, which has no authtoken for the forwarder
  template: bindings-forwarder/deployment.yaml
  set:
    ngrok.features:
      oneClickDemoMode:
        enabled: true
  asserts:
    - hasDocuments:
        count: 0
