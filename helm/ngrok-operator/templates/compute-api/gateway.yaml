{{- if and (hasKey .Values.compute "remoteAccess") .Values.compute.remoteAccess.enabled }}
{{- $name := include "ngrok-operator.computeGatewayName" . }}
{{- $replicaNamespace := include "ngrok-operator.computeReplicaNamespace" . }}
{{- /*
Pod-level settings live under .Values.computeGateway rather than under
.Values.compute, because .Values.compute is serialized verbatim into
--compute-metadata and sent to the ngrok API as KubernetesOperator metadata.
*/}}
{{- $gateway := .Values.computeGateway }}
{{- if eq $replicaNamespace .Release.Namespace }}
{{- fail "compute.remoteAccess.replicaNamespace must differ from the Helm release namespace" }}
{{- end }}
{{- if empty .Values.compute.remoteAccess.replicaNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $replicaNamespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute-replicas
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $replicaNamespace }}
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["ngrok.k8s.ngrok.com"]
  resources: ["agentendpoints"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $replicaNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute-api
spec:
  replicas: {{ $gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "ngrok-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: compute-api
  template:
    metadata:
      {{- if or $gateway.podAnnotations .Values.podAnnotations }}
      annotations:
        {{- if $gateway.podAnnotations }}
          {{- toYaml $gateway.podAnnotations | nindent 8 }}
        {{- else }}
          {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "ngrok-operator.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
          {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: compute-api
    spec:
      {{- if $gateway.priorityClassName }}
      priorityClassName: {{ $gateway.priorityClassName | quote }}
      {{- end }}
      {{- if $gateway.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $gateway.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "component" "compute-api" "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "component" "compute-api" "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- with $gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $name }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: gateway
        image: {{ include "ngrok-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - compute-api-gateway
        {{- if .Values.serverAddr }}
        - --server-addr={{ .Values.serverAddr }}
        {{- end }}
        {{- if .Values.rootCAs }}
        - --root-cas={{ .Values.rootCAs }}
        {{- end }}
        ports:
        - name: health
          containerPort: 8081
        env:
        - name: NGROK_AUTHTOKEN
          valueFrom:
            secretKeyRef:
              key: AUTHTOKEN
              name: {{ include "ngrok-operator.credentialsSecretName" . }}
        volumeMounts:
        - name: endpoint-config
          mountPath: /etc/ngrok/compute-api
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
        {{- toYaml $gateway.resources | nindent 10 }}
      volumes:
      - name: endpoint-config
        configMap:
          name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-agent
  namespace: {{ $replicaNamespace }}
rules:
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ingress.k8s.ngrok.com"]
  resources: ["domains"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["ngrok.k8s.ngrok.com"]
  resources: ["agentendpoints"]
  verbs: ["get", "list", "patch", "update", "watch"]
- apiGroups: ["ngrok.k8s.ngrok.com"]
  resources: ["agentendpoints/finalizers"]
  verbs: ["patch", "update"]
- apiGroups: ["ngrok.k8s.ngrok.com"]
  resources: ["agentendpoints/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["ngrok.k8s.ngrok.com"]
  resources: ["ngroktrafficpolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-agent
  namespace: {{ $replicaNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-agent
subjects:
- kind: ServiceAccount
  name: {{ template "ngrok-operator.agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
