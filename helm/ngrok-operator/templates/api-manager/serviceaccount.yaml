{{- if .Values.apiManager.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "ngrok-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- if .Values.apiManager.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.apiManager.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
