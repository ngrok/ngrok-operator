{{- include "ngrok-operator.validateValues" . }}{{- /* LEGACY-values-layout: delete this line */}}
{{- $component := "controller" }}
{{- $values := fromYaml (include "ngrok-operator.componentValues" (dict "context" $ "component" "apiManager")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  name: {{ include "ngrok-operator.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  annotations:
    checksum/controller-role: {{ include (print $.Template.BasePath "/api-manager/role.yaml") . | sha256sum }}
    checksum/rbac: {{ include (print $.Template.BasePath "/api-manager/leader-election-role.yaml") . | sha256sum }}
spec:
  replicas: {{ $values.replicaCount }}
  {{- with $values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ngrok-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      annotations:
        {{- with $values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        prometheus.io/path: /metrics
        prometheus.io/port: '8080'
        prometheus.io/scrape: 'true'
        checksum/controller-role: {{ include (print $.Template.BasePath "/api-manager/role.yaml") . | sha256sum }}
        checksum/rbac: {{ include (print $.Template.BasePath "/api-manager/leader-election-role.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/credentials-secret.yaml") . | sha256sum }}
      labels:
        {{- include "ngrok-operator.selectorLabels" . | nindent 8 }}
        {{- with $values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      {{- with $values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if $values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" $values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" $values.podAffinityPreset "component" $component "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" $values.podAntiAffinityPreset "component" $component "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" $values.nodeAffinityPreset.type "key" $values.nodeAffinityPreset.key "values" $values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ template "ngrok-operator.serviceAccountName" . }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: ngrok-operator
        image: {{ include "ngrok-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /ngrok-operator
        args:
        - api-manager
        - --release-name={{ .Release.Name }}
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        - --election-id={{ include "ngrok-operator.fullname" . }}-leader
        - --manager-name={{ include "ngrok-operator.fullname" . }}-manager
        securityContext:
          allowPrivilegeEscalation: false
        env:
        {{- /* In one-click demo mode the api-manager starts without credentials. */}}
        {{- if not .Values.features.oneClickDemoMode.enabled }}
        - name: NGROK_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              key: {{ include "ngrok-operator.accessTokenSecretKey" "apiManager" }}
              name: {{ include "ngrok-operator.credentialsSecretName" . }}
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HELM_RELEASE_NAME
          value: {{ .Release.Name | quote }}
        {{- include "ngrok-operator.componentEnv" (dict "context" $ "component" "apiManager") | trim | nindent 8 }}
        {{- range $key, $value := $values.extraEnv }}
        - name: {{ $key }}
          value: {{- toYaml $value | nindent 12 }}
        {{- end }}
        {{- with $values.extraVolumeMounts }}
        volumeMounts:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $values.lifecycle }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
        {{- toYaml $values.resources | nindent 10 }}
      {{- with $values.extraVolumes }}
      volumes:
      {{- toYaml . | nindent 6 }}
      {{- end }}
