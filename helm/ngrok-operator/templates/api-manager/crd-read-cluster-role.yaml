# Lets api-manager read its own KubernetesOperator CRD. When the CRD itself is
# being deleted (a helm rollback to a release without it, or CRDs removed
# before the uninstall hook ran), the KubernetesOperator is deleted with it and
# the controller must not treat that as an uninstall and drain every ngrok
# resource. This is always a ClusterRole, even with `watchNamespace` set,
# because CRDs are cluster-scoped. It is limited to that one CRD by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-crd-read-cluster-role
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - kubernetesoperators.ngrok.com
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-crd-read-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ngrok-operator.fullname" . }}-crd-read-cluster-role
subjects:
- kind: ServiceAccount
  name: {{ template "ngrok-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
