{{- if .Values.components.apiManager.podDisruptionBudget.create }}
{{ $component := "controller"}}
{{- $values := fromYaml (include "ngrok-operator.componentValues" (dict "context" $ "component" "apiManager")) -}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-controller-pdb
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if .Values.components.apiManager.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.components.apiManager.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.components.apiManager.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.components.apiManager.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ngrok-operator.selectorLabels" . | nindent 6 }}
      {{- with $values.podLabels }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
