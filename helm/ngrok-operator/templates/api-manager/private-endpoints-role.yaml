{{- if .Values.ngrok.features.privateEndpoints.enabled }}
# api-manager: poller writes PrivateEndpoints, controller writes their status
# and the per-hostname Services. Always the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-private-endpoints-manager
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [ngrok.com]
  resources: [privateendpoints]
  verbs: [get, list, watch, create, update, delete]
- apiGroups: [ngrok.com]
  resources: [privateendpoints/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch, create, update, patch, delete]
# The poller's NotAdopted Event on a hand-made CR. The api-manager's own
# events rule follows watchNamespace, which may not be the release namespace.
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-private-endpoints-manager
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ngrok-operator.fullname" . }}-private-endpoints-manager
subjects:
- kind: ServiceAccount
  name: {{ include "ngrok-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
