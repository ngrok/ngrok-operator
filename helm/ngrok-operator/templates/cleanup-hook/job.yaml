{{- if .Values.ngrok.features.cleanup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ngrok-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cleanup
    spec:
      serviceAccountName: {{ include "ngrok-operator.fullname" . }}-cleanup
      restartPolicy: OnFailure
      containers:
        - name: cleanup
          image: "{{ .Values.components.cleanupHook.image.repository }}:{{ .Values.components.cleanupHook.image.tag }}"
          imagePullPolicy: {{ .Values.components.cleanupHook.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Deleting KubernetesOperator '{{ .Release.Name }}' to trigger drain..."
              # Both KubernetesOperator kinds share the plural, so names are
              # fully qualified; a bare "kubernetesoperator" is ambiguous.
              # LEGACY-kubernetesoperator-kind: BEGIN — drop at cleanup. The
              # operator skips the drain while a legacy object still exists,
              # so remove it first. Release its finalizer in case the operator
              # never did, so nothing tries to drain it.
              kubectl patch kubernetesoperators.ngrok.k8s.ngrok.com "{{ .Release.Name }}" -n {{ .Release.Namespace }} --type=merge -p '{"metadata":{"finalizers":null}}' || true
              kubectl delete kubernetesoperators.ngrok.k8s.ngrok.com "{{ .Release.Name }}" -n {{ .Release.Namespace }} --ignore-not-found --wait=true --timeout=60s || true
              # LEGACY-kubernetesoperator-kind: END
              kubectl delete kubernetesoperators.ngrok.com "{{ .Release.Name }}" -n {{ .Release.Namespace }} --wait=true --timeout={{ .Values.ngrok.features.cleanup.timeout }}s || true
              {{- if .Values.installCRDs }}
              # LEGACY-kubernetesoperator-kind / LEGACY-trafficpolicy-kind:
              # BEGIN — drop at cleanup. The ngrok.com CRDs carry
              # helm.sh/resource-policy=keep so a rollback cannot delete them,
              # which also stops helm uninstall from deleting them. Delete them
              # here, but only once the drain has finished.
              if KO=$(kubectl get kubernetesoperators.ngrok.com "{{ .Release.Name }}" -n {{ .Release.Namespace }} --ignore-not-found -o name) && [ -z "$KO" ]; then
                echo "Deleting the ngrok.com CRDs kept for rollback..."
                kubectl delete crd kubernetesoperators.ngrok.com trafficpolicies.ngrok.com --ignore-not-found || true
              else
                echo "KubernetesOperator is still present; leaving the ngrok.com CRDs in place"
              fi
              # LEGACY-kubernetesoperator-kind / LEGACY-trafficpolicy-kind: END
              {{- end }}
          resources:
            {{- toYaml .Values.components.cleanupHook.resources | nindent 12 }}
{{- end }}
