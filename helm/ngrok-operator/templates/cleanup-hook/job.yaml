{{- if .Values.ngrok.features.cleanup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ngrok-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cleanup
    spec:
      serviceAccountName: {{ include "ngrok-operator.fullname" . }}-cleanup
      restartPolicy: OnFailure
      containers:
        - name: cleanup
          image: "{{ .Values.components.cleanupHook.image.repository }}:{{ .Values.components.cleanupHook.image.tag }}"
          imagePullPolicy: {{ .Values.components.cleanupHook.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              RELEASE="{{ .Release.Name }}"
              NAMESPACE="{{ .Release.Namespace }}"
              # Both KubernetesOperator kinds use the plural
              # "kubernetesoperators", so every name below is fully qualified.

              # LEGACY-kubernetesoperator-kind: BEGIN — drop in R2.
              # 1. Remove the legacy KubernetesOperator. While it exists, the
              #    operator treats deleting the v1 object as a rollback and
              #    skips the drain. The operator releases the legacy finalizer
              #    once the v1 object holds the ngrok ID. If it does not within
              #    the timeout (operator down, or the ID never adopted), clear
              #    the finalizer so the uninstall can finish; the legacy ngrok
              #    registration may then be left behind.
              echo "Removing the legacy KubernetesOperator..."
              if ! kubectl delete kubernetesoperators.ngrok.k8s.ngrok.com "$RELEASE" -n "$NAMESPACE" \
                --ignore-not-found --wait=true --timeout=60s; then
                echo "The operator did not release the legacy KubernetesOperator; clearing its finalizer"
                kubectl patch kubernetesoperators.ngrok.k8s.ngrok.com "$RELEASE" -n "$NAMESPACE" \
                  --type=merge -p '{"metadata":{"finalizers":null}}' || true
              fi
              # Deleting the KubernetesOperator below would skip the drain if
              # the legacy one were still here or could not be checked, so fail
              # and let the Job retry. A legacy kind that is no longer served
              # counts as absent, as it does for the operator.
              ERR=$(mktemp)
              if ! LEGACY=$(kubectl get kubernetesoperators.ngrok.k8s.ngrok.com "$RELEASE" -n "$NAMESPACE" \
                --ignore-not-found -o name 2>"$ERR"); then
                if grep -q "doesn't have a resource type" "$ERR"; then
                  LEGACY=""
                else
                  cat "$ERR" >&2
                  echo "Could not check for the legacy KubernetesOperator; not deleting the KubernetesOperator"
                  exit 1
                fi
              fi
              if [ -n "$LEGACY" ]; then
                echo "The legacy KubernetesOperator is still present; not deleting the KubernetesOperator"
                exit 1
              fi
              # LEGACY-kubernetesoperator-kind: END

              # 2. Delete the KubernetesOperator. Its finalizer runs the drain.
              echo "Deleting KubernetesOperator '$RELEASE' to trigger drain..."
              kubectl delete kubernetesoperators.ngrok.com "$RELEASE" -n "$NAMESPACE" \
                --wait=true --timeout={{ .Values.ngrok.features.cleanup.timeout }}s || true
          resources:
            {{- toYaml .Values.components.cleanupHook.resources | nindent 12 }}
{{- end }}
