{{- if .Values.ngrok.features.cleanup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - ngrok.com
    resources:
      - kubernetesoperators
    verbs:
      - get
      - list
      - watch
      - delete
  # LEGACY-kubernetesoperator-kind: BEGIN — drop at cleanup.
  - apiGroups:
      - ngrok.k8s.ngrok.com
    resources:
      - kubernetesoperators
    verbs:
      - get
      - list
      - watch
      - patch
      - delete
  # LEGACY-kubernetesoperator-kind: END
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ngrok-operator.fullname" . }}-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ include "ngrok-operator.fullname" . }}-cleanup
    namespace: {{ .Release.Namespace }}
{{- if .Values.installCRDs }}
# LEGACY-kubernetesoperator-kind / LEGACY-trafficpolicy-kind: BEGIN — drop
# this ClusterRole and binding at cleanup. Lets the uninstall hook delete the
# two ngrok.com CRDs that helm.sh/resource-policy=keep stops Helm from deleting.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup-crds
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - kubernetesoperators.ngrok.com
      - trafficpolicies.ngrok.com
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-cleanup-crds
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ngrok-operator.fullname" . }}-cleanup-crds
subjects:
  - kind: ServiceAccount
    name: {{ include "ngrok-operator.fullname" . }}-cleanup
    namespace: {{ .Release.Namespace }}
# LEGACY-kubernetesoperator-kind / LEGACY-trafficpolicy-kind: END
{{- end }}
{{- end }}
