{{- /* LEGACY-values-layout: delete this check. A top-level credentials key is
caught by ngrok-operator.validateValues; this catches the 0.24 key names moved
under ngrok.credentials without being renamed. */}}
{{- $creds := .Values.ngrok.credentials | default dict }}
{{- if or (hasKey $creds "apiKey") (hasKey $creds "authtoken") }}
{{- fail "ngrok.credentials.apiKey and ngrok.credentials.authtoken are not read. They have been replaced by a single ngrok.credentials.accessToken (an ngrok access token). See https://dashboard.ngrok.com/access-tokens" }}
{{- end }}
{{- $agentToken := include "ngrok-operator.accessTokenFor" (dict "root" $ "component" "agent") }}
{{- $apiManagerToken := include "ngrok-operator.accessTokenFor" (dict "root" $ "component" "apiManager") }}
{{- $privateEndpointsToken := include "ngrok-operator.accessTokenFor" (dict "root" $ "component" "privateEndpointForwarder") }}
{{- if and (or $agentToken $apiManagerToken) (or (not $agentToken) (not $apiManagerToken)) }}
{{- fail "Only one component has an ngrok access token. Set ngrok.credentials.accessToken for both, or set both ngrok.credentials.agent.accessToken and ngrok.credentials.apiManager.accessToken." }}
{{- end }}
{{- if or $agentToken $apiManagerToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ngrok-operator.credentialsSecretName" .}}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if $agentToken }}
  {{ include "ngrok-operator.accessTokenSecretKey" "agent" }}: {{ $agentToken | b64enc }}
  {{- end }}
  {{- if $apiManagerToken }}
  {{ include "ngrok-operator.accessTokenSecretKey" "apiManager" }}: {{ $apiManagerToken | b64enc }}
  {{- end }}
  {{- if and .Values.ngrok.features.privateEndpoints.enabled $privateEndpointsToken }}
  {{ include "ngrok-operator.accessTokenSecretKey" "privateEndpointForwarder" }}: {{ $privateEndpointsToken | b64enc }}
  {{- end }}
{{- end }}
