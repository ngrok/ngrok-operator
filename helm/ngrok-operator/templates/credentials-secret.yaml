{{- if or .Values.credentials.apiKey .Values.credentials.authtoken }}
{{- fail "credentials.apiKey and credentials.authtoken have been replaced by a single credentials.accessToken (an ngrok access token). See https://dashboard.ngrok.com/access-tokens" }}
{{- end }}
{{- $agentToken := include "ngrok-operator.accessTokenFor" (dict "root" $ "component" "agent") }}
{{- $apiManagerToken := include "ngrok-operator.accessTokenFor" (dict "root" $ "component" "apiManager") }}
{{- if and (or $agentToken $apiManagerToken) (or (not $agentToken) (not $apiManagerToken)) }}
{{- fail "Only one component has an ngrok access token. Set credentials.accessToken for both, or set both credentials.agent.accessToken and credentials.apiManager.accessToken." }}
{{- end }}
{{- if or $agentToken $apiManagerToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ngrok-operator.credentialsSecretName" .}}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if $agentToken }}
  {{ include "ngrok-operator.accessTokenSecretKey" "agent" }}: {{ $agentToken | b64enc }}
  {{- end }}
  {{- if $apiManagerToken }}
  {{ include "ngrok-operator.accessTokenSecretKey" "apiManager" }}: {{ $apiManagerToken | b64enc }}
  {{- end }}
{{- end }}
