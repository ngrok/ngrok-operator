{{- if or .Values.credentials.apiKey .Values.credentials.authtoken }}
{{- fail "credentials.apiKey and credentials.authtoken have been replaced by a single credentials.pat (an ngrok personal access token). See https://dashboard.ngrok.com/settings/access-tokens" }}
{{- end }}
{{- if not (empty .Values.credentials.pat) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ngrok-operator.credentialsSecretName" .}}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  PAT: {{ .Values.credentials.pat | b64enc }}
{{ end }}
