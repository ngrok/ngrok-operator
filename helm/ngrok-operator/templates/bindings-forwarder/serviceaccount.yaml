{{- if .Values.ngrok.features.bindings.enabled }}
{{- if .Values.components.bindingsForwarder.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "ngrok-operator.bindings.forwarder.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- if .Values.components.bindingsForwarder.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.components.bindingsForwarder.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
