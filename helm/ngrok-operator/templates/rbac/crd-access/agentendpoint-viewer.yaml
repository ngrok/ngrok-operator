{{- if .Values.crdAccessRoles.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-agentendpoint-viewer-role
  labels:
    app.kubernetes.io/component: rbac
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  {{- with .Values.crdAccessRoles.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
- apiGroups:
  - ngrok.com
  resources:
  - agentendpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ngrok.com
  resources:
  - agentendpoints/status
  verbs:
  - get
# LEGACY-agentendpoint-kind: BEGIN — drop these two rule blocks at cleanup.
- apiGroups:
  - ngrok.k8s.ngrok.com
  resources:
  - agentendpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ngrok.k8s.ngrok.com
  resources:
  - agentendpoints/status
  verbs:
  - get
# LEGACY-agentendpoint-kind: END
{{- end }}
