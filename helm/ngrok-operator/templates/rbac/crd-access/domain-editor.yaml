{{- if .Values.crdAccessRoles.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-domain-editor-role
  labels:
    app.kubernetes.io/component: rbac
    {{- include "ngrok-operator.labels" . | nindent 4 }}
  {{- with .Values.crdAccessRoles.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
- apiGroups:
  - ngrok.com
  resources:
  - domains
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ngrok.com
  resources:
  - domains/status
  verbs:
  - get
# LEGACY-domain-kind: BEGIN — drop these two rule blocks at cleanup. The role
# keeps its name, so bindings to it keep working.
- apiGroups:
  - ingress.k8s.ngrok.com
  resources:
  - domains
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ingress.k8s.ngrok.com
  resources:
  - domains/status
  verbs:
  - get
# LEGACY-domain-kind: END
{{- end }}
