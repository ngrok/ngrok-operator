{{- if .Values.ngrok.features.privateEndpoints.enabled }}
{{- if .Values.components.privateEndpointForwarder.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ngrok-operator.privateEndpoints.forwarder.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ngrok-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: private-endpoint-forwarder
  {{- with .Values.components.privateEndpointForwarder.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-private-endpoint-forwarder
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [ngrok.com]
  resources: [privateendpoints]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ngrok-operator.fullname" . }}-private-endpoint-forwarder
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ngrok-operator.fullname" . }}-private-endpoint-forwarder
subjects:
- kind: ServiceAccount
  name: {{ include "ngrok-operator.privateEndpoints.forwarder.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
