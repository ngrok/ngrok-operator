## @section Components: Cleanup Hook
##
## The pod of the pre-delete hook `ngrok.features.cleanup` runs. It does not
## take `components.common`.
##
## @param components.cleanupHook.image.repository The repository for the kubectl image used by the cleanup hook
## @param components.cleanupHook.image.tag The tag for the kubectl image
## @param components.cleanupHook.image.pullPolicy The pull policy for the cleanup hook image
## @param components.cleanupHook.resources.limits The resources limits for the cleanup hook container
## @param components.cleanupHook.resources.requests The requested resources for the cleanup hook container
##
components:
  common:
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAffinityPreset: ""
    podAntiAffinityPreset: soft
    nodeAffinityPreset:
      type: ""
      key: ""
      values: []
    topologySpreadConstraints: []
    priorityClassName: ""
    extraEnv: {}
