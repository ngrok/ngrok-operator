##
## @section Common parameters
##
## @param nameOverride String to partially override generated resource names
## @param fullnameOverride String to fully override generated resource names
## @param commonLabels Labels to add to all deployed objects
## @param commonAnnotations Annotations to add to all deployed objects
##
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

##
## @section Image configuration
##
## @param image.registry The ngrok operator image registry.
## @param image.repository The ngrok operator image repository.
## @param image.tag The ngrok operator image tag. Defaults to the chart's appVersion if not specified
## @param image.pullPolicy The ngrok operator image pull policy.
## @param image.pullSecrets An array of imagePullSecrets to be used when pulling the image.
##
image:
  registry: docker.io
  repository: ngrok/ngrok-operator
  tag: ""
  pullPolicy: IfNotPresent
  ## Example
  ## pullSecrets:
  ## - name: my-imagepull-secret
  ##
  pullSecrets: []

##
## @section RBAC
##
## @param crdAccessRoles.create Whether to create editor/viewer ClusterRoles for CRDs
## @param crdAccessRoles.annotations Annotations for CRD access ClusterRoles (e.g., RBAC aggregation)
##
crdAccessRoles:
  create: true
  annotations: {}

##
## @section Custom Resource Definitions installation
##
## @param installCRDs When true, the ngrok CRDs will be installed alongside the operator
##
installCRDs: true

##
## @section ngrok
##
## How the operator connects to ngrok and what it does. Set once for every
## component: which component reads a setting is an implementation detail.
## `log` is the exception and can be overridden for one component under
## `components.<component>.log` (for example `components.agent.log.level`).
##
## An empty value means "not set": the operator's built-in default applies.
## Those defaults live in the operator binary and are listed here for reference.
##
## @param ngrok.credentials.secret.name The name of the secret the credentials are in. If not provided, one will be generated using the helm release name.
## @param ngrok.credentials.accessToken Your ngrok access token. Used by every component that needs one, unless overridden below.
## @param ngrok.credentials.agent.accessToken Optional access token for the agent-manager only. Falls back to ngrok.credentials.accessToken.
## @param ngrok.credentials.apiManager.accessToken Optional access token for the api-manager only. Falls back to ngrok.credentials.accessToken.
## @param ngrok.description Description of this installation in the ngrok dashboard. Default: `The official ngrok Kubernetes Operator.`
## @param ngrok.region ngrok region to use. Default: the account's default region
## @param ngrok.serverAddr Address of the ngrok server to use for tunnels. Default: the ngrok default
## @param ngrok.apiURL Base URL for the ngrok API. Default: the ngrok default
## @param ngrok.rootCAs Root CAs to trust: `trusted` for the ngrok CA, `host` for the host's CA bundle. Default: `trusted`
## @param ngrok.metadata Key/value pairs added as metadata to the ngrok API resources the operator creates
## @param ngrok.clusterDomain Cluster domain used when resolving in-cluster service addresses. Default: `svc.cluster.local`
## @param ngrok.log.level Log level: `debug`, `info`, `error`, `panic`, or an integer for more verbose debug levels. Default: `info`
## @param ngrok.log.format Log format: `json` or `console`. Default: `json`
## @param ngrok.log.stacktraceLevel Level at and above which stacktraces are captured: `info`, `error` or `panic`. Default: `error`
## @param ngrok.features.ingress.enabled Enable the Kubernetes Ingress controller
## @param ngrok.features.ingress.controllerName Controller name matched by IngressClasses, and set on the IngressClass this chart creates
## @param ngrok.features.ingress.watchNamespace Namespace to watch for Ingress and AgentEndpoint resources. Default: all namespaces
## @param ngrok.features.ingress.ingressClass.name IngressClass resource name
## @param ngrok.features.ingress.ingressClass.create Create the IngressClass resource
## @param ngrok.features.ingress.ingressClass.default Set the IngressClass as the cluster default
## @param ngrok.features.gateway.enabled Enable Gateway API support, if the Gateway API CRDs are detected
## @param ngrok.features.gateway.disableReferenceGrants Disable the ReferenceGrant requirement for cross-namespace references
## @param ngrok.features.bindings.enabled Enable the Endpoint Bindings feature, including the bindings-forwarder
## @param ngrok.features.bindings.endpointSelectors CEL expressions filtering which endpoints are projected into this cluster. Default: `["true"]`
## @param ngrok.features.bindings.serviceAnnotations Annotations applied to projected services
## @param ngrok.features.bindings.serviceLabels Labels applied to projected services
## @param ngrok.features.bindings.ingressEndpoint Hostname of the bindings ingress endpoint. Default: `kubernetes-binding-ingress.ngrok.io:443`
## @param ngrok.features.domains.defaultReclaimPolicy Reclaim policy given to the Domains the operator creates: `Delete` or `Retain`. Default: `Delete`
## @param ngrok.features.cleanup.enabled Run a pre-delete hook on uninstall that deletes the KubernetesOperator resource, so the operator drains before it is removed
## @param ngrok.features.cleanup.timeout Seconds the hook waits for the drain to finish
## @param ngrok.features.cleanup.drainPolicy What the drain does with the ngrok API resources the operator created: `Delete` or `Retain`. Default: `Retain`
## @param ngrok.features.oneClickDemoMode.enabled Start without credentials and become Ready without reconciling, for marketplace installs. Also skips rendering the agent and bindings-forwarder
##
ngrok:
  credentials:
    secret:
      name: ""
    accessToken: ""
    ## One token for everything is the simple path. The per-component values set a
    ## separate token for each component, falling back to accessToken when empty,
    ## so each token can be scoped to only the permissions its component needs.
    agent:
      accessToken: ""
    apiManager:
      accessToken: ""
  description: ""
  region: ""
  serverAddr: ""
  apiURL: ""
  rootCAs: ""
  metadata: {}
  clusterDomain: ""
  log:
    level: ""
    format: ""
    stacktraceLevel: ""
  features:
    ingress:
      enabled: true
      controllerName: k8s.ngrok.com/ingress-controller
      watchNamespace: ""
      ingressClass:
        name: ngrok
        create: true
        default: false
    gateway:
      enabled: true
      disableReferenceGrants: false
    bindings:
      enabled: false
      endpointSelectors: []
      serviceAnnotations: {}
      serviceLabels: {}
      ingressEndpoint: ""
    domains:
      defaultReclaimPolicy: ""
    cleanup:
      enabled: true
      timeout: 300
      drainPolicy: ""
    oneClickDemoMode:
      enabled: false

##
## @section Components
##
## Kubernetes settings for each pod the chart runs.
##
## `components.common` applies to the api-manager, agent and bindings-forwarder.
## Each of them can override any common key, listed commented out under the
## component:
##   - a key the component leaves unset inherits the common value;
##   - a non-empty map merges with the common one, the component winning per key;
##   - any other value, including an empty `{}`, `[]` or `""`, replaces it, so
##     `components.agent.tolerations: []` drops the common tolerations for the
##     agent alone.
## A null value is removed by Helm before the chart sees it, so setting one key
## of a map to null clears the whole map for that component.
##
## Commented-out keys have no chart default; Kubernetes' own default applies
## until one is set.
##
## @param components.common.podAnnotations Pod annotations
## @param components.common.podLabels Pod labels
## @param components.common.nodeSelector Node labels for pod assignment
## @param components.common.tolerations Tolerations for pod assignment
## @param components.common.affinity Affinity rules. Overrides the presets below when set
## @param components.common.podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param components.common.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param components.common.nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param components.common.nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set.
## @param components.common.nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
## @param components.common.topologySpreadConstraints Topology spread constraints for pod assignment
## @param components.common.priorityClassName Priority class for pod scheduling
## @param components.common.extraEnv Additional environment variables, as a map of name to value
## @extra components.common.terminationGracePeriodSeconds Graceful shutdown period, in seconds. Kubernetes default: `30`
## @extra components.common.updateStrategy Deployment update strategy. Kubernetes default: `RollingUpdate`
##
