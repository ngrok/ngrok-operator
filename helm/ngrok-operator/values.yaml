##
## @descriptionStart
## Every key under `defaults` can also be set here as `agent.<key>` to
## override it for the agent pods alone. Maps deep-merge with the
## component winning per key; arrays replace wholesale.
##
## `agent.log.*` overrides the shared logging section above for the agent
## alone, and `agent.watchNamespace` is an agent-only setting with no shared
## equivalent. Both use a `null` default: "not set" means the operator
## binary's own default applies.
## @descriptionEnd
##
## @param agent.replicaCount The number of agent replicas to run
## @param agent.serviceAccount.create Whether to create a ServiceAccount
## @param agent.serviceAccount.name ServiceAccount name; generated if empty
## @param agent.serviceAccount.annotations Additional ServiceAccount annotations
## @param agent.updateStrategy.type Deployment update strategy
## @skip agent.podAnnotations
## @skip agent.podLabels
## @skip agent.nodeSelector
## @skip agent.tolerations
## @skip agent.affinity
## @skip agent.podAffinityPreset
## @skip agent.podAntiAffinityPreset
## @skip agent.nodeAffinityPreset
## @skip agent.topologySpreadConstraints
## @skip agent.priorityClassName
## @skip agent.resources
## @skip agent.extraVolumes
## @skip agent.extraVolumeMounts
## @skip agent.extraEnv
## @skip agent.lifecycle
## @skip agent.terminationGracePeriodSeconds
##
agent:
  replicaCount: 1
  ## Per-component overrides for the pod settings in `defaults`. Maps deep-merge
  ## with the component winning per key; arrays replace wholesale. Omit a key to
  ## inherit the value from `defaults`.
  ## podAnnotations: {}
  ## podLabels: {}
  ## nodeSelector: {}
  ## tolerations: []
  ## affinity: {}
  ## podAffinityPreset: ""
  ## podAntiAffinityPreset: soft
  ## nodeAffinityPreset: {}
  ## topologySpreadConstraints: []
  ## priorityClassName: ""
  ## resources: {}
  ## extraVolumes: []
  ## extraVolumeMounts: []
  ## extraEnv: {}
  ## lifecycle: {}
  ## terminationGracePeriodSeconds: 30
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  updateStrategy:
    type: RollingUpdate
  ## @param agent.watchNamespace [string,nullable] Namespace to watch for AgentEndpoint resources. Unset watches all namespaces.
  ## @param agent.log.level [string,nullable] Overrides `log.level` for the agent only
  ## @param agent.log.format [string,nullable] Overrides `log.format` for the agent only
  ## @param agent.log.stacktraceLevel [string,nullable] Overrides `log.stacktraceLevel` for the agent only
  watchNamespace: null
  log:
    level: null
    format: null
    stacktraceLevel: null

