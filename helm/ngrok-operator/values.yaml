##
## @section Common parameters
##
## @param nameOverride Partially override the generated resource names
## @param fullnameOverride Fully override the generated resource names
## @param commonLabels Labels added to all resources created by this chart
## @param commonAnnotations Annotations added to all resources created by this chart
##
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

##
## @param image.registry The ngrok operator image registry.
## @param image.repository The ngrok operator image repository.
## @param image.tag The ngrok operator image tag. Defaults to the chart's appVersion if not specified
## @param image.pullPolicy The ngrok operator image pull policy.
## @param image.pullSecrets An array of imagePullSecrets to be used when pulling the image.
##
image:
  registry: docker.io
  repository: ngrok/ngrok-operator
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

##
## @section Shared component defaults
##
## Settings here are deep-merged into apiManager, agent and bindingsForwarder.
## A component's own value wins on a key conflict. Maps merge; arrays replace.
##
## This is deliberately not called `global`: Helm reserves `global` for values
## propagated into subcharts, and this chart depends on bitnamicharts/common,
## which already assigns meaning to global.imageRegistry and friends.
##
## @param defaults.podAnnotations Pod annotations for every component
## @param defaults.podLabels Pod labels for every component
## @param defaults.nodeSelector Node labels for pod assignment
## @param defaults.tolerations Tolerations for every component's pods
## @param defaults.affinity Affinity rules for every component's pods. Overrides the presets below when set.
## @param defaults.podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: "" (none), "soft" or "hard"
## @param defaults.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: "" (none), "soft" or "hard"
## @param defaults.nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: "" (none), "soft" or "hard"
## @param defaults.nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set.
## @param defaults.nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
## @param defaults.topologySpreadConstraints Topology spread constraints
## @param defaults.priorityClassName Priority class for pod scheduling
## @param defaults.resources.limits Resource limits for every component
## @param defaults.resources.requests Resource requests for every component
## @param defaults.extraVolumes Additional volumes
## @param defaults.extraVolumeMounts Additional volume mounts
## @param defaults.extraEnv Additional environment variables
## @param defaults.lifecycle Container lifecycle hooks
## @param defaults.terminationGracePeriodSeconds Graceful shutdown period
##
defaults:
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  topologySpreadConstraints: []
  priorityClassName: ""
  resources:
    limits: {}
    requests: {}
  extraVolumes: []
  extraVolumeMounts: []
  extraEnv: {}
  lifecycle: {}
  terminationGracePeriodSeconds: 30

##
## @section ngrok platform configuration
##
## A `null` value means "not set": the operator binary's default applies.
## Defaults live in `internal/config.Default()` and are shown in the README,
## which is generated from the `@param` annotations below. A Go test asserts
## the two agree.
##
## @param ngrok.description [string,nullable] Description attached to the ngrok API resources the operator creates. Default: `The official ngrok Kubernetes Operator.`
## @param ngrok.region [string,nullable] ngrok region to use. Unset means the account default
## @param ngrok.serverAddr [string,nullable] Address of the ngrok server to use for tunnels. Unset means the ngrok default
## @param ngrok.apiURL [string,nullable] Base URL for the ngrok API. Unset means the ngrok default
## @param ngrok.rootCAs [string,nullable] Root CAs to use: `trusted` for the ngrok CA, `host` for the host's CA bundle. Default: `trusted`
## @param ngrok.clusterDomain [string,nullable] Cluster domain used when resolving in-cluster service addresses. Default: `svc.cluster.local`
## @param ngrok.metadata Key/value pairs added as metadata to the ngrok API resources the operator creates
##
ngrok:
  description: null
  region: null
  serverAddr: null
  apiURL: null
  rootCAs: null
  clusterDomain: null
  metadata: {}

##
## @section Logging configuration
##
## Set here to apply to all three components. Each component can override any
## of these for itself as `<component>.log.<key>`.
##
## @param log.level [string,nullable] Log level: `debug`, `info`, `warn`, `error`, `dpanic`, `panic` or `fatal`. Default: `info`
## @param log.format [string,nullable] Log format: `json` or `console`. Default: `json`
## @param log.stacktraceLevel [string,nullable] Level at which to emit stacktraces: `debug`, `info`, `warn`, `error`, `dpanic`, `panic` or `fatal`. Default: `error`
##
log:
  level: null
  format: null
  stacktraceLevel: null

##
## @section Feature configuration
##
## Each feature's flag lives with that feature's config. Enabling a feature is
## a single switch: features.bindings.enabled both turns on the controller and
## causes the bindings-forwarder Deployment to be rendered.
##
## @param features.ingress.enabled Enable the Kubernetes Ingress controller
## @param features.ingress.controllerName Controller name for IngressClass matching. Must match the operator's own `--ingress-controller-name`
## @param features.ingress.watchNamespace [string,nullable] Namespace to watch for Ingress resources. Unset watches all namespaces
## @param features.ingress.ingressClass.name IngressClass resource name
## @param features.ingress.ingressClass.create Create the IngressClass resource
## @param features.ingress.ingressClass.default Set as the default IngressClass
## @param features.gateway.enabled Enable Gateway API support, if the CRDs are detected
## @param features.gateway.disableReferenceGrants Disable the ReferenceGrant requirement for cross-namespace references
## @param features.bindings.enabled Enable the Endpoint Bindings feature
## @param features.bindings.endpointSelectors [array,nullable] CEL expressions filtering which endpoints to project. Default: `["true"]`
## @param features.bindings.serviceAnnotations Annotations applied to projected services
## @param features.bindings.serviceLabels Labels applied to projected services
## @param features.bindings.ingressEndpoint [string,nullable] Hostname of the bindings ingress endpoint. Default: `kubernetes-binding-ingress.ngrok.io:443`
## @param features.defaultDomainReclaimPolicy [string,nullable] Default reclaim policy for Domains: `Delete` or `Retain`. Default: `Delete`
## @param features.drainPolicy [string,nullable] Drain policy on uninstall: `Delete` or `Retain`. Default: `Retain`
##
features:
  ingress:
    enabled: true
    controllerName: k8s.ngrok.com/ingress-controller
    watchNamespace: null
    ingressClass:
      name: ngrok
      create: true
      default: false
  gateway:
    enabled: true
    disableReferenceGrants: false
  bindings:
    enabled: false
    endpointSelectors: null
    serviceAnnotations: {}
    serviceLabels: {}
    ingressEndpoint: null
  defaultDomainReclaimPolicy: null
  drainPolicy: null

##
## @section Credentials configuration
##
## @param credentials.secret.name The name of the secret the credentials are in. If not provided, one will be generated using the helm release name.
## @param credentials.apiKey Your ngrok API key. If provided, the authtoken must be provided as well.
## @param credentials.authtoken Your ngrok authtoken. If provided, the apiKey must be provided as well.
##
credentials:
  secret:
    name: ""
  apiKey: ""
  authtoken: ""

##
## @section API Manager component
##
## @descriptionStart
## Every key under `defaults` can also be set here as `apiManager.<key>` to
## override it for the api-manager pods alone. Maps deep-merge with the
## component winning per key; arrays replace wholesale.
##
## `apiManager.log.*` overrides the shared logging section above for the
## api-manager alone, and `apiManager.oneClickDemoMode` is an api-manager-only
## setting with no shared equivalent. Both use a `null` default: "not set"
## means the operator binary's own default applies.
## @descriptionEnd
##
## @param apiManager.replicaCount The number of api-manager replicas to run
## @param apiManager.podDisruptionBudget.create Whether to create a PodDisruptionBudget
## @param apiManager.podDisruptionBudget.maxUnavailable Maximum unavailable pods
## @param apiManager.podDisruptionBudget.minAvailable [string,nullable] Minimum available pods. Set this instead of `maxUnavailable`, not alongside it
## @param apiManager.serviceAccount.create Whether to create a ServiceAccount
## @param apiManager.serviceAccount.name ServiceAccount name; generated if empty
## @param apiManager.serviceAccount.annotations Additional ServiceAccount annotations
## @param apiManager.updateStrategy.type Deployment update strategy
## @skip apiManager.podAnnotations
## @skip apiManager.podLabels
## @skip apiManager.nodeSelector
## @skip apiManager.tolerations
## @skip apiManager.affinity
## @skip apiManager.podAffinityPreset
## @skip apiManager.podAntiAffinityPreset
## @skip apiManager.nodeAffinityPreset
## @skip apiManager.topologySpreadConstraints
## @skip apiManager.priorityClassName
## @skip apiManager.resources
## @skip apiManager.extraVolumes
## @skip apiManager.extraVolumeMounts
## @skip apiManager.extraEnv
## @skip apiManager.lifecycle
## @skip apiManager.terminationGracePeriodSeconds
##
apiManager:
  replicaCount: 1
  ## Per-component overrides for the pod settings in `defaults`. Maps deep-merge
  ## with the component winning per key; arrays replace wholesale. Omit a key to
  ## inherit the value from `defaults`.
  ## podAnnotations: {}
  ## podLabels: {}
  ## nodeSelector: {}
  ## tolerations: []
  ## affinity: {}
  ## podAffinityPreset: ""
  ## podAntiAffinityPreset: soft
  ## nodeAffinityPreset: {}
  ## topologySpreadConstraints: []
  ## priorityClassName: ""
  ## resources: {}
  ## extraVolumes: []
  ## extraVolumeMounts: []
  ## extraEnv: {}
  ## lifecycle: {}
  ## terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    create: false
    maxUnavailable: "1"
    minAvailable: null
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  updateStrategy:
    type: RollingUpdate
  ## App config for this component. Overrides the shared sections above for the
  ## api-manager alone. A null value means "not set": the operator binary's
  ## default applies.
  ##
  ## @param apiManager.oneClickDemoMode Start the api-manager without credentials, for demo installs. Also stops the agent and bindings-forwarder Deployments from rendering.
  ## @param apiManager.log.level [string,nullable] Overrides `log.level` for the api-manager only
  ## @param apiManager.log.format [string,nullable] Overrides `log.format` for the api-manager only
  ## @param apiManager.log.stacktraceLevel [string,nullable] Overrides `log.stacktraceLevel` for the api-manager only
  oneClickDemoMode: false
  log:
    level: null
    format: null
    stacktraceLevel: null

##
