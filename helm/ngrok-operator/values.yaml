##
## @section Common parameters
##
## @param nameOverride String to partially override generated resource names
## @param fullnameOverride String to fully override generated resource names
## @param commonLabels Labels to add to all deployed objects
## @param commonAnnotations Annotations to add to all deployed objects
##
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

##
## @section Image configuration
##
## @param image.registry The ngrok operator image registry.
## @param image.repository The ngrok operator image repository.
## @param image.tag The ngrok operator image tag. Defaults to the chart's appVersion if not specified
## @param image.pullPolicy The ngrok operator image pull policy.
## @param image.pullSecrets An array of imagePullSecrets to be used when pulling the image.
##
image:
  registry: docker.io
  repository: ngrok/ngrok-operator
  tag: ""
  pullPolicy: IfNotPresent
  ## Example
  ## pullSecrets:
  ## - name: my-imagepull-secret
  ##
  pullSecrets: []

##
## @section Shared pod settings
##
## Applied to the pods of every component. Any key here can also be set on a
## component (for example `agent.tolerations`) to override it for that
## component alone. Maps merge with the component winning per key; lists
## replace.
##
## @param defaults.podAnnotations Pod annotations
## @param defaults.podLabels Pod labels
## @param defaults.nodeSelector Node labels for pod assignment
## @param defaults.tolerations Tolerations for pod assignment
## @param defaults.affinity Affinity rules. Overrides the presets below when set
## @param defaults.podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param defaults.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param defaults.nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param defaults.nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set.
## @param defaults.nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
## @param defaults.topologySpreadConstraints Topology spread constraints for pod assignment
## @param defaults.priorityClassName Priority class for pod scheduling
## @param defaults.extraEnv Additional environment variables, as a map of name to value
##
defaults:
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: {}

##
## @section Operator configuration
##
## Passed to every component. Any key here can also be set under
## `<component>.config` (for example `agent.config.log.level`) to override it
## for that component alone.
##
## An empty value means "not set": the operator's built-in default applies.
## Those defaults live in the operator binary and are listed here for reference.
##
## @param ngrok.description Description of this installation in the ngrok dashboard. Default: `The official ngrok Kubernetes Operator.`
## @param ngrok.region ngrok region to use. Default: the account's default region
## @param ngrok.serverAddr Address of the ngrok server to use for tunnels. Default: the ngrok default
## @param ngrok.apiURL Base URL for the ngrok API. Default: the ngrok default
## @param ngrok.rootCAs Root CAs to trust: `trusted` for the ngrok CA, `host` for the host's CA bundle. Default: `trusted`
## @param ngrok.clusterDomain Cluster domain used when resolving in-cluster service addresses. Default: `svc.cluster.local`
## @param ngrok.metadata Key/value pairs added as metadata to the ngrok API resources the operator creates
##
ngrok:
  description: ""
  region: ""
  serverAddr: ""
  apiURL: ""
  rootCAs: ""
  clusterDomain: ""
  metadata: {}

## @param log.level Log level: `debug`, `info`, `error`, `panic`, or an integer for more verbose debug levels. Default: `info`
## @param log.format Log format: `json` or `console`. Default: `json`
## @param log.stacktraceLevel Level at and above which stacktraces are captured: `info`, `error` or `panic`. Default: `error`
##
log:
  level: ""
  format: ""
  stacktraceLevel: ""

## @param features.ingress.enabled Enable the Kubernetes Ingress controller
## @param features.ingress.controllerName Controller name matched by IngressClasses, and set on the IngressClass this chart creates
## @param features.ingress.watchNamespace Namespace to watch for Ingress and AgentEndpoint resources. Default: all namespaces
## @param features.ingress.ingressClass.name IngressClass resource name
## @param features.ingress.ingressClass.create Create the IngressClass resource
## @param features.ingress.ingressClass.default Set the IngressClass as the cluster default
## @param features.gateway.enabled Enable Gateway API support, if the Gateway API CRDs are detected
## @param features.gateway.disableReferenceGrants Disable the ReferenceGrant requirement for cross-namespace references
## @param features.bindings.enabled Enable the Endpoint Bindings feature, including the bindings-forwarder
## @param features.bindings.endpointSelectors CEL expressions filtering which endpoints are projected into this cluster. Default: `["true"]`
## @param features.bindings.serviceAnnotations Annotations applied to projected services
## @param features.bindings.serviceLabels Labels applied to projected services
## @param features.bindings.ingressEndpoint Hostname of the bindings ingress endpoint. Default: `kubernetes-binding-ingress.ngrok.io:443`
## @param features.defaultDomainReclaimPolicy Default reclaim policy for Domains: `Delete` or `Retain`. Default: `Delete`
## @param features.drainPolicy What to do with ngrok API resources on uninstall: `Delete` or `Retain`. Default: `Retain`
##
features:
  ingress:
    enabled: true
    controllerName: k8s.ngrok.com/ingress-controller
    watchNamespace: ""
    ingressClass:
      name: ngrok
      create: true
      default: false
  gateway:
    enabled: true
    disableReferenceGrants: false
  bindings:
    enabled: false
    endpointSelectors: []
    serviceAnnotations: {}
    serviceLabels: {}
    ingressEndpoint: ""
  defaultDomainReclaimPolicy: ""
  drainPolicy: ""

##
## @section Credentials configuration
##
## @param credentials.secret.name The name of the secret the credentials are in. If not provided, one will be generated using the helm release name.
## @param credentials.accessToken Your ngrok access token. Used by every component that needs one, unless overridden below.
## @param credentials.agent.accessToken Optional access token for the agent-manager only. Falls back to credentials.accessToken.
## @param credentials.apiManager.accessToken Optional access token for the api-manager only. Falls back to credentials.accessToken.
##
credentials:
  secret:
    name: ""
  accessToken: ""
  ## One token for everything is the simple path. The per-component values set a
  ## separate token for each component, falling back to accessToken when empty,
  ## so each token can be scoped to only the permissions its component needs.
  agent:
    accessToken: ""
  apiManager:
    accessToken: ""

##
## @section API Manager
##
## Any key from `defaults` can also be set here to override it for the
## api-manager alone.
##
## @param apiManager.replicaCount The number of api-manager replicas to run
## @param apiManager.resources.limits Resource limits
## @param apiManager.resources.requests Resource requests
## @param apiManager.lifecycle Container lifecycle hooks
## @param apiManager.terminationGracePeriodSeconds Graceful shutdown period
## @param apiManager.extraVolumes Additional volumes
## @param apiManager.extraVolumeMounts Additional volume mounts
## @param apiManager.podDisruptionBudget.create Whether to create a PodDisruptionBudget
## @param apiManager.podDisruptionBudget.maxUnavailable Maximum unavailable pods
## @param apiManager.podDisruptionBudget.minAvailable Minimum available pods. Set this instead of `maxUnavailable`, not alongside it
## @param apiManager.serviceAccount.create Whether to create a ServiceAccount
## @param apiManager.serviceAccount.name ServiceAccount name. Generated if empty
## @param apiManager.serviceAccount.annotations ServiceAccount annotations
## @param apiManager.updateStrategy.type Deployment update strategy
## @param apiManager.config.oneClickDemoMode Start without credentials and become Ready without reconciling, for marketplace installs. Also skips rendering the agent and bindings-forwarder
##
apiManager:
  replicaCount: 1
  resources:
    limits: {}
    requests: {}
  lifecycle: {}
  terminationGracePeriodSeconds: 30
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    create: false
    maxUnavailable: "1"
    minAvailable: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  updateStrategy:
    type: RollingUpdate
  ## Operator configuration overrides for the api-manager, in the same shape as
  ## the shared operator configuration above.
  config:
    oneClickDemoMode: false

##
## @section Agent
##
## Any key from `defaults` can also be set here to override it for the agent
## alone.
##
## @param agent.replicaCount The number of agent replicas to run
## @param agent.resources.limits Resource limits
## @param agent.resources.requests Resource requests
## @param agent.lifecycle Container lifecycle hooks
## @param agent.terminationGracePeriodSeconds Graceful shutdown period
## @param agent.extraVolumes Additional volumes
## @param agent.extraVolumeMounts Additional volume mounts
## @param agent.serviceAccount.create Whether to create a ServiceAccount
## @param agent.serviceAccount.name ServiceAccount name. Generated if empty
## @param agent.serviceAccount.annotations ServiceAccount annotations
## @param agent.updateStrategy.type Deployment update strategy
## @param agent.config Operator configuration overrides for the agent, in the same shape as the shared operator configuration above
##
agent:
  replicaCount: 1
  resources:
    limits: {}
    requests: {}
  lifecycle: {}
  terminationGracePeriodSeconds: 30
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  updateStrategy:
    type: RollingUpdate
  config: {}

##
## @section Bindings Forwarder
##
## Rendered only when `features.bindings.enabled` is true. Any key from
## `defaults` can also be set here to override it for the bindings-forwarder
## alone.
##
## @param bindingsForwarder.replicaCount The number of bindings-forwarder replicas to run
## @param bindingsForwarder.resources.limits Resource limits
## @param bindingsForwarder.resources.requests Resource requests
## @param bindingsForwarder.lifecycle Container lifecycle hooks
## @param bindingsForwarder.terminationGracePeriodSeconds Graceful shutdown period
## @param bindingsForwarder.extraVolumes Additional volumes
## @param bindingsForwarder.extraVolumeMounts Additional volume mounts
## @param bindingsForwarder.serviceAccount.create Whether to create a ServiceAccount
## @param bindingsForwarder.serviceAccount.name ServiceAccount name. Generated if empty
## @param bindingsForwarder.serviceAccount.annotations ServiceAccount annotations
## @param bindingsForwarder.updateStrategy.type Deployment update strategy
## @param bindingsForwarder.config Operator configuration overrides for the bindings-forwarder, in the same shape as the shared operator configuration above
##
bindingsForwarder:
  replicaCount: 1
  resources:
    limits: {}
    requests: {}
  lifecycle: {}
  terminationGracePeriodSeconds: 30
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  updateStrategy:
    type: RollingUpdate
  config: {}

##
## @section RBAC
##
## @param crdAccessRoles.create Whether to create editor/viewer ClusterRoles for CRDs
## @param crdAccessRoles.annotations Annotations for CRD access ClusterRoles (e.g., RBAC aggregation)
##
crdAccessRoles:
  create: true
  annotations: {}

##
## @section Custom Resource Definitions installation
##
## @param installCRDs When true, the ngrok CRDs will be installed alongside the operator
##
installCRDs: true

##
## @section Cleanup Hook configuration
##
## @param cleanupHook.enabled Enable the pre-delete cleanup hook that drains resources before uninstall
## @param cleanupHook.timeout Timeout in seconds for the cleanup process
## @param cleanupHook.image.repository The repository for the kubectl image used by the cleanup hook
## @param cleanupHook.image.tag The tag for the kubectl image
## @param cleanupHook.image.pullPolicy The pull policy for the cleanup hook image
## @param cleanupHook.resources.limits The resources limits for the cleanup hook container
## @param cleanupHook.resources.requests The requested resources for the cleanup hook container
##
cleanupHook:
  enabled: true
  timeout: 300
  image:
    repository: bitnami/kubectl
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits: {}
    requests: {}
