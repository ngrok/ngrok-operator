# A rule with no backends and no filters has nothing to do with a request, so the Gateway API requires
# a 500 for it.
input:
  gatewayClasses:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: ngrok
    spec:
      controllerName: ngrok.com/gateway-controller
  gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: test-gateway
      namespace: default
      annotations:
        k8s.ngrok.com/mapping-strategy: "endpoints-verbose"
    spec:
      gatewayClassName: ngrok
      listeners:
        - name: test-hostname
          hostname: "test-hostname.ngrok.io"
          port: 443
          protocol: HTTPS
  httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: test-route
      namespace: default
    spec:
      hostnames:
      - test-hostname.ngrok.io
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
      rules:
      - matches:
          - path:
              type: PathPrefix
              value: /test-service-1
        backendRefs: [] # Nothing to do here
        filters: [] # Nothing to do here
  services:
  - apiVersion: v1
    kind: Service
    metadata:
      name: test-service-1
      namespace: default
    spec:
      ports:
      - name: http
        port: 8080
        protocol: TCP
        targetPort: http
      type: ClusterIP
expected:
  agentEndpoints: []
  cloudEndpoints:
  - apiVersion: ngrok.com/v1
    kind: CloudEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: test-gateway.default-test-hostname.ngrok.io
      namespace: default
    spec:
      trafficPolicy:
        inline:
          on_http_request:
          - actions:
            - config:
                content: This route has no backends
                headers:
                  content-type: text/plain
                status_code: 500
              type: custom-response
            expressions:
            - (req.url.path == '/test-service-1' || req.url.path.startsWith('/test-service-1/'))
            name: Unresolved-Backend-500
          - actions:
            - config:
                content: No route was found for this ngrok Endpoint
                headers:
                  content-type: text/plain
                status_code: 404
              type: custom-response
            name: Fallback-404
      url: https://test-hostname.ngrok.io
