# Tests that Services within backendRefs require reference grants for cross namespace. A backend
# referenced without one gets a 500, as the Gateway API requires for an invalid backendRef.
input:
  gatewayClasses:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: ngrok
    spec:
      controllerName: ngrok.com/gateway-controller
  gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: test-gateway
      namespace: default
      annotations:
        k8s.ngrok.com/mapping-strategy: "endpoints-verbose"
    spec:
      gatewayClassName: ngrok
      infrastructure:
        annotations:
          annotation-key: annotation-val
        labels:
          label-key: label-val
      listeners:
        - name: test-hostname
          hostname: "test-hostname.ngrok.io"
          port: 443
          protocol: HTTPS
  httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: test-route
      namespace: default
    spec:
      hostnames:
      - test-hostname.ngrok.io
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
      rules:
      - matches:
          - path:
              type: PathPrefix
              value: /same-namespace-svc
        backendRefs:
          - group: ""
            kind: Service
            name: same-namespace-svc
            port: 8080
            weight: 1
      - matches:
          - path:
              type: PathPrefix
              value: /cross-namespace # Not allowed without a ReferenceGrant
        backendRefs:
          - group: ""
            kind: Service
            name: cross-namespace-svc
            namespace: other
            port: 8080
            weight: 1
  services:
  - apiVersion: v1
    kind: Service
    metadata:
      name: same-namespace-svc
      namespace: default
    spec:
      ports:
      - name: http
        port: 8080
        protocol: TCP
        targetPort: http
      type: ClusterIP
  - apiVersion: v1
    kind: Service
    metadata:
      name: cross-namespace-svc
      namespace: other
    spec:
      ports:
      - name: http
        port: 8080
        protocol: TCP
        targetPort: http
      type: ClusterIP
expected:
  agentEndpoints:
  - apiVersion: ngrok.com/v1
    kind: AgentEndpoint
    metadata:
      annotations:
        annotation-key: annotation-val
      labels:
        label-key: label-val
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: e3b0c-same-namespace-svc-default-8080
      namespace: default
    spec:
      upstream:
        url: http://same-namespace-svc.default:8080
      url: https://e3b0c-same-namespace-svc-default-8080.internal
  cloudEndpoints:
  - apiVersion: ngrok.com/v1
    kind: CloudEndpoint
    metadata:
      annotations:
        annotation-key: annotation-val
      labels:
        label-key: label-val
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: test-gateway.default-test-hostname.ngrok.io
      namespace: default
    spec:
      trafficPolicy:
        inline:
          on_http_request:
          - actions:
            - config:
                url: https://e3b0c-same-namespace-svc-default-8080.internal
              type: forward-internal
            expressions:
            - (req.url.path == '/same-namespace-svc' || req.url.path.startsWith('/same-namespace-svc/'))
            name: Generated-Route
          - actions:
            - config:
                content: The backend for this route is not available
                headers:
                  content-type: text/plain
                status_code: 500
              type: custom-response
            expressions:
            - (req.url.path == '/cross-namespace' || req.url.path.startsWith('/cross-namespace/'))
            name: Unresolved-Backend-500
          - actions:
            - config:
                content: No route was found for this ngrok Endpoint
                headers:
                  content-type: text/plain
                status_code: 404
              type: custom-response
            name: Fallback-404
      url: https://test-hostname.ngrok.io
