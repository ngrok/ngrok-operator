# Request mirror filters are not currently supported and should be ignored. Rules whose backendRefs are
# invalid (not a Service, missing port, missing Service) answer with a 500, as the Gateway API requires.
input:
  gatewayClasses:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: ngrok
    spec:
      controllerName: ngrok.com/gateway-controller
  gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: test-gateway
      namespace: default
      annotations:
        k8s.ngrok.com/mapping-strategy: "endpoints-verbose"
    spec:
      gatewayClassName: ngrok
      listeners:
        - name: test-hostname
          hostname: "test-hostname.ngrok.io"
          port: 443
          protocol: HTTPS
  httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: test-route
      namespace: default
    spec:
      hostnames:
      - test-hostname.ngrok.io
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: test-gateway
        namespace: default
      rules:
      - matches: # This one is fine and should be preserved
          - path:
              type: PathPrefix
              value: /test-service-1
        backendRefs:
          - group: ""
            kind: Service
            name: test-service-1
            port: 8080
            weight: 1
      - matches: # Kind is not a service
          - path:
              type: PathPrefix
              value: /test-service-1
        backendRefs:
          - group: ""
            kind: ConfigMap
            name: test-service-1
            port: 8080
            weight: 1
      - matches: # Port not specified
          - path:
              type: PathPrefix
              value: /test-service-1
        backendRefs:
          - group: ""
            kind: Service
            name: test-service-2
            weight: 1
      - matches: # Service is missing specified port
          - path:
              type: PathPrefix
              value: /test-service-3
        backendRefs:
          - group: ""
            kind: Service
            name: test-service-1
            port: 9999
            weight: 1
      - matches: # Service does not exist
          - path:
              type: PathPrefix
              value: /test-service-4
        backendRefs:
          - group: ""
            kind: Service
            name: missing-service
            port: 8080
            weight: 1
  services:
  - apiVersion: v1
    kind: Service
    metadata:
      name: test-service-1
      namespace: default
    spec:
      ports:
      - name: http
        port: 8080
        protocol: TCP
        targetPort: http
      type: ClusterIP
expected:
  agentEndpoints:
  - apiVersion: ngrok.com/v1
    kind: AgentEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: e3b0c-test-service-1-default-8080
      namespace: default
    spec:
      upstream:
        url: http://test-service-1.default:8080
      url: https://e3b0c-test-service-1-default-8080.internal
  cloudEndpoints:
  - apiVersion: ngrok.com/v1
    kind: CloudEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: test-gateway.default-test-hostname.ngrok.io
      namespace: default
    spec:
      trafficPolicy:
        inline:
          on_http_request:
          - actions:
            - config:
                url: https://e3b0c-test-service-1-default-8080.internal
              type: forward-internal
            expressions:
            - (req.url.path == '/test-service-1' || req.url.path.startsWith('/test-service-1/'))
            name: Generated-Route
          - actions:
            - config:
                content: The backend for this route is not available
                headers:
                  content-type: text/plain
                status_code: 500
              type: custom-response
            expressions:
            - (req.url.path == '/test-service-1' || req.url.path.startsWith('/test-service-1/'))
            name: Unresolved-Backend-500
          - actions:
            - config:
                content: The backend for this route is not available
                headers:
                  content-type: text/plain
                status_code: 500
              type: custom-response
            expressions:
            - (req.url.path == '/test-service-1' || req.url.path.startsWith('/test-service-1/'))
            name: Unresolved-Backend-500
          - actions:
            - config:
                content: The backend for this route is not available
                headers:
                  content-type: text/plain
                status_code: 500
              type: custom-response
            expressions:
            - (req.url.path == '/test-service-3' || req.url.path.startsWith('/test-service-3/'))
            name: Unresolved-Backend-500
          - actions:
            - config:
                content: The backend for this route is not available
                headers:
                  content-type: text/plain
                status_code: 500
              type: custom-response
            expressions:
            - (req.url.path == '/test-service-4' || req.url.path.startsWith('/test-service-4/'))
            name: Unresolved-Backend-500
          - actions:
            - config:
                content: No route was found for this ngrok Endpoint
                headers:
                  content-type: text/plain
                status_code: 404
              type: custom-response
            name: Fallback-404
      url: https://test-hostname.ngrok.io
