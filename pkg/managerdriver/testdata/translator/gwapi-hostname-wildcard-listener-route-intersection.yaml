# A wildcard listener with one route for the whole wildcard and one for a single name under it.
# Each route hostname gets its own endpoint: foo.example.com serves route-b first (its exact hostname
# wins) and falls back to route-a, whose *.example.com covers it. bar.example.com and every other name
# are served by the *.example.com endpoint, which only has route-a.
input:
  gatewayClasses:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: ngrok
    spec:
      controllerName: ngrok.com/gateway-controller
  gateways:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: gw
      namespace: default
      annotations:
        k8s.ngrok.com/mapping-strategy: "endpoints-verbose"
    spec:
      gatewayClassName: ngrok
      listeners:
        - name: http
          hostname: "*.example.com"
          port: 80
          protocol: HTTP
  httpRoutes:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-a
      namespace: default
    spec:
      hostnames: ["*.example.com"]
      parentRefs:
      - name: gw
      rules:
      - matches:
        - path: {type: PathPrefix, value: /}
        backendRefs:
        - {name: svc-a, port: 80}
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: route-b
      namespace: default
    spec:
      hostnames: ["foo.example.com"]
      parentRefs:
      - name: gw
      rules:
      - matches:
        - path: {type: PathPrefix, value: /}
        backendRefs:
        - {name: svc-b, port: 80}
  services:
  - apiVersion: v1
    kind: Service
    metadata: {name: svc-a, namespace: default}
    spec:
      ports: [{name: http, port: 80, protocol: TCP}]
  - apiVersion: v1
    kind: Service
    metadata: {name: svc-b, namespace: default}
    spec:
      ports: [{name: http, port: 80, protocol: TCP}]
expected:
  gatewayHostnames:
    default/gw: ["*.example.com", "foo.example.com"]
  agentEndpoints:
  - apiVersion: ngrok.com/v1
    kind: AgentEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: e3b0c-svc-a-default-80
      namespace: default
    spec:
      upstream:
        url: http://svc-a.default:80
      url: http://e3b0c-svc-a-default-80.internal
  - apiVersion: ngrok.com/v1
    kind: AgentEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: e3b0c-svc-b-default-80
      namespace: default
    spec:
      upstream:
        url: http://svc-b.default:80
      url: http://e3b0c-svc-b-default-80.internal
  cloudEndpoints:
  - apiVersion: ngrok.com/v1
    kind: CloudEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: gw.default-foo.example.com
      namespace: default
    spec:
      trafficPolicy:
        inline:
          on_http_request:
          - actions:
            - config:
                url: http://e3b0c-svc-b-default-80.internal
              type: forward-internal
            expressions:
            - req.url.path.startsWith('/')
            name: Generated-Route
          - actions:
            - config:
                url: http://e3b0c-svc-a-default-80.internal
              type: forward-internal
            expressions:
            - req.url.path.startsWith('/')
            name: Generated-Route
          - actions:
            - config:
                content: No route was found for this ngrok Endpoint
                headers:
                  content-type: text/plain
                status_code: 404
              type: custom-response
            name: Fallback-404
      url: http://foo.example.com
      poolingEnabled: true
  - apiVersion: ngrok.com/v1
    kind: CloudEndpoint
    metadata:
      labels:
        ngrok.com/controller-name: test-manager-name
        ngrok.com/controller-namespace: test-manager-namespace
      name: gw.default-wildcard.example.com
      namespace: default
    spec:
      trafficPolicy:
        inline:
          on_http_request:
          - actions:
            - config:
                url: http://e3b0c-svc-a-default-80.internal
              type: forward-internal
            expressions:
            - req.url.path.startsWith('/')
            name: Generated-Route
          - actions:
            - config:
                content: No route was found for this ngrok Endpoint
                headers:
                  content-type: text/plain
                status_code: 404
              type: custom-response
            name: Fallback-404
      url: http://*.example.com
      poolingEnabled: true
