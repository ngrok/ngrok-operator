# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: private-endpoints-http
spec:
  description: |
    http and https private endpoints on one hostname are mirrored into two
    PrivateEndpoints sharing one Service, and a pod reaches both by URL, with
    the https certificate verified.
  bindings:
    - name: operatorNamespace
      value: (env('KUBE_NAMESPACE') || 'ngrok-operator')
    - name: host
      value: (join('', [$namespace, '-web.ngrok.direct']))
    - name: service
      value: (join('', [$namespace, '-web-ngrok-direct']))
  steps:
    - name: create origin, endpoints and client
      try:
        - apply: { file: ../_fixtures/client.yaml }
        - apply: { file: ../_fixtures/web.yaml }
        - apply:
            resource:
              apiVersion: ngrok.k8s.ngrok.com/v1alpha1
              kind: AgentEndpoint
              metadata:
                name: web-http
              spec:
                url: (join('', ['http://', $host]))
                bindings: [internal]
                upstream:
                  url: (join('', ['http://web.', $namespace, ':80']))
        - apply:
            resource:
              apiVersion: ngrok.k8s.ngrok.com/v1alpha1
              kind: AgentEndpoint
              metadata:
                name: web-https
              spec:
                url: (join('', ['https://', $host]))
                bindings: [internal]
                upstream:
                  url: (join('', ['http://web.', $namespace, ':80']))

    - name: mirrored into PrivateEndpoints and one Service
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: ngrok.com/v1
              kind: PrivateEndpoint
              metadata:
                namespace: ($operatorNamespace)
              spec:
                hostname: ($host)
                scheme: http
                port: 80
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
        - assert:
            timeout: 2m
            resource:
              apiVersion: ngrok.com/v1
              kind: PrivateEndpoint
              metadata:
                namespace: ($operatorNamespace)
              spec:
                hostname: ($host)
                scheme: https
                port: 443
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: ($service)
                namespace: ($operatorNamespace)
                labels:
                  ngrok.com/managed-by: private-endpoint-poller
              spec:
                (length(ports)): 2
      catch:
        - podLogs:
            namespace: ($operatorNamespace)
            selector: app.kubernetes.io/component=controller
            tail: 50

    - name: reachable from a pod
      try:
        - wait:
            apiVersion: v1
            kind: Pod
            name: client
            timeout: 2m
            for:
              condition:
                name: Ready
        - script:
            timeout: 3m
            env:
              - name: HOST
                value: ($host)
              - name: SERVICE
                value: ($service)
              - name: OP_NS
                value: ($operatorNamespace)
            content: |
              set -e
              ip="$(kubectl -n "$OP_NS" get svc "$SERVICE" -o jsonpath='{.spec.clusterIP}')"
              [ -n "$ip" ]
              ../_fixtures/check.sh "$ip" "dig +short $HOST"
              ../_fixtures/check.sh "hello from $NAMESPACE" "curl -sS -m 10 http://$HOST"
              ../_fixtures/check.sh "200 ssl_verify=0" "curl -sS -m 10 -o /dev/null -w '%{http_code} ssl_verify=%{ssl_verify_result}' https://$HOST"
      catch:
        - podLogs:
            namespace: ($operatorNamespace)
            selector: app.kubernetes.io/component=private-endpoint-forwarder
            tail: 50
