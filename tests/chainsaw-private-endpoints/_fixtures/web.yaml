apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          env:
            - name: NS
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          args: ["-listen=:5678", "-text=hello from $(NS)"]
          ports: [{containerPort: 5678}]
          readinessProbe:
            httpGet: {path: /, port: 5678}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 5678}]
