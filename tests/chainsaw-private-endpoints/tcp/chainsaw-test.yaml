# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: private-endpoints-tcp
spec:
  description: |
    A tcp private endpoint is reachable from a pod on its own port (redis PING).
  bindings:
    - name: operatorNamespace
      value: (env('KUBE_NAMESPACE') || 'ngrok-operator')
    - name: host
      value: (join('', [$namespace, '-redis.ngrok.direct']))
  steps:
    - name: create origin, endpoint and client
      try:
        - apply: { file: ../_fixtures/client.yaml }
        - apply: { file: ../_fixtures/redis.yaml }
        - apply:
            resource:
              apiVersion: ngrok.k8s.ngrok.com/v1alpha1
              kind: AgentEndpoint
              metadata:
                name: redis
              spec:
                url: (join('', ['tcp://', $host, ':6379']))
                bindings: [internal]
                upstream:
                  url: (join('', ['tcp://redis.', $namespace, ':6379']))

    - name: mirrored into a PrivateEndpoint
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: ngrok.com/v1
              kind: PrivateEndpoint
              metadata:
                namespace: ($operatorNamespace)
              spec:
                hostname: ($host)
                scheme: tcp
                port: 6379
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
      catch:
        - podLogs:
            namespace: ($operatorNamespace)
            selector: app.kubernetes.io/component=controller
            tail: 50

    - name: reachable from a pod
      try:
        - wait:
            apiVersion: v1
            kind: Pod
            name: client
            timeout: 2m
            for:
              condition:
                name: Ready
        - script:
            timeout: 3m
            env:
              - name: HOST
                value: ($host)
            content: |
              ../_fixtures/check.sh "+PONG" "printf 'PING\r\n' | nc -w 3 $HOST 6379"
      catch:
        - podLogs:
            namespace: ($operatorNamespace)
            selector: app.kubernetes.io/component=private-endpoint-forwarder
            tail: 50
