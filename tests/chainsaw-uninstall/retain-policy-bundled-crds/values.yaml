# Scenario: retain-policy-bundled-crds
# Overrides base values - only specify what's different
#
# - ngrok.features.cleanup.drainPolicy: Retain (default - resources preserved in ngrok API)
# - installCRDs: true (default, bundled with operator)

# ngrok.features.cleanup.drainPolicy defaults to Retain, so we don't need to set it
# But being explicit for clarity:
ngrok:
  features:
    cleanup:
      drainPolicy: Retain
