# Scenario: multi-ns-delete-policy - Operator A
# Namespace-scoped operator watching namespace-a only

agent: {}
apiManager: {}
features:
  drainPolicy: Delete
  ingress:
    controllerName: k8s.ngrok.com/ingress-controller-a
    ingressClass:
      name: ngrok-a
    watchNamespace: namespace-a
installCRDs: false
