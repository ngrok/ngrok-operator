# Scenario: bindings-retain-policy
# Tests BoundEndpoint behavior during uninstall with Retain drain policy
#
# - ngrok.features.cleanup.drainPolicy: Retain (CloudEndpoint preserved in ngrok API)
# - ngrok.features.bindings.enabled: true (enables BoundEndpoint feature)
# - installCRDs: true (bundled CRDs for simplicity)

ngrok:
  features:
    cleanup:
      drainPolicy: Retain
    bindings:
      enabled: true
      endpointSelectors:
        - "true"  # Accept all kubernetes-bound endpoints
