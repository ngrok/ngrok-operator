# Base Helm values for all uninstall e2e tests
# Scenario-specific values can override these via additional --values or --set

agent: {}
apiManager: {}
image:
  pullPolicy: Never
  repository: ngrok-operator-local
  tag: latest
log:
  format: console
  level: debug

# Default to Retain (the actual default) - scenarios override as needed
# features.drainPolicy: Retain

# Default to bundled CRDs - scenarios override as needed
# installCRDs: true
