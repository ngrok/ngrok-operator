# Scenario: delete-policy-separate-crds
# Overrides base values - only specify what's different
#
# - ngrok.features.cleanup.drainPolicy: Delete (resources cleaned up from ngrok API)
# - installCRDs: false (CRDs installed separately via ngrok-crds chart)

ngrok:
  features:
    cleanup:
      drainPolicy: Delete
installCRDs: false
