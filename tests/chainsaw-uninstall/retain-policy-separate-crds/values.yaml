# Scenario: retain-policy-separate-crds
# Overrides base values - only specify what's different
#
# - ngrok.features.cleanup.drainPolicy: Retain (default, resources preserved in ngrok API)
# - installCRDs: false (CRDs installed separately via ngrok-crds chart)

ngrok:
  features:
    cleanup:
      drainPolicy: Retain
installCRDs: false
