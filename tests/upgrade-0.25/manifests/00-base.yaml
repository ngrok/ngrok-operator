# Namespace and a backend everything else routes to.
apiVersion: v1
kind: Namespace
metadata:
  name: upgrade-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: upgrade-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: upgrade-test
spec:
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
