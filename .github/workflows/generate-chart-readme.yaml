name: 'Helm Readme Generator'

on:
  pull_request_target:
    branches:
    - main
    paths:
    - 'helm/*/values.yaml'
permissions:
  contents: write
jobs:
  update-readme:
    name: Update README.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install readme-generator-for-helm
        run: npm install -g @bitnami/readme-generator-for-helm@2.6.1
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute readme-generator-for-helm
        working-directory: helm/ngrok-operator
        run: readme-generator --values "values.yaml" --readme "README.md" --schema "values.schema.json"
      # The same command as `make close-schema`, inlined on purpose:
      # pull_request_target runs with a write token on the PR author's
      # checkout, so running their Makefile would hand them the token. jq
      # only reads the files it is given and cannot run commands.
      - name: Close the generated schema
        working-directory: helm/ngrok-operator
        run: |
          jq --indent 4 --rawfile values values.yaml -f close-schema.jq values.schema.json > values.schema.json.tmp
          mv values.schema.json.tmp values.schema.json
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: Update README.md and values.schema.json with readme-generator-for-helm
