version: "2"
linters:
  enable:
    - gocritic
    - govet
    - errcheck
    - ineffassign
    - unconvert
    - misspell
    - revive
  # GO-1.27-LINT: BEGIN
  # staticcheck and unused belong to golangci-lint's default linter set, so they
  # have to be turned off here explicitly -- dropping them from `enable` above
  # is not enough. Both are driven by honnef.co/go/tools, which golangci-lint
  # 2.12.2 vendors at v0.7.0. That version's IR builder panics ("unexpected
  # expr: *ast.KeyValueExpr") on Go 1.27's new struct-literal field-selector
  # keys, which the go1.27 standard library itself uses -- so it cannot analyze
  # any package, whether or not that package uses generic methods. Delete this
  # block once golangci-lint ships a 1.27-aware staticcheck.
  disable:
    - staticcheck
    - unused
  # GO-1.27-LINT: END
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST*"
        - "-QF*"
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: comment-spacings
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: datarace
        - name: defer
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: identical-branches
        - name: if-return
        - name: indent-error-flow
        - name: unconditional-recursion
        - name: unhandled-error
          arguments:
            - fmt.Printf
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: use-errors-new
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
