version: "2"
linters:
  enable:
    - gocritic
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert
    - misspell
    - revive
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST*"
        - "-QF*"
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: comment-spacings
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: datarace
        - name: defer
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: identical-branches
        - name: if-return
        - name: indent-error-flow
        - name: unconditional-recursion
        - name: unhandled-error
          arguments:
            - fmt.Printf
            # strings.Builder writes always return a nil error.
            - strings.Builder.WriteString
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: use-errors-new
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # This branch builds with a newer golangci-lint (Go 1.27.3 security
      # patch) whose staticcheck flags these deprecated fields. They are used
      # on purpose: the controllers dual-write and read the legacy CloudEndpoint
      # traffic-policy fields during the migration window, and the tests cover
      # that path. main silences the same call sites with inline nolint
      # comments (#878); this release branch excludes them here instead to keep
      # the patch's Go diff minimal. Scoped to these symbols so other SA1019
      # findings still surface.
      - linters:
          - staticcheck
        text: 'SA1019: .*(v1alpha1\.CloudEndpointSpec\)\.TrafficPolicyName|v1alpha1\.CloudEndpointTrafficPolicyCfg\)\.Policy|controller-runtime\.Result\)\.Requeue) is deprecated'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
